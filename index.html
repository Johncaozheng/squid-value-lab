<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squid Value Lab</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap");

/* Layout: a card-room instrument; the squid monitor and the hand's action bar beside one big range grid; bounty maths and the tutorial sit behind tabs. */
:root {
  --bg: #edf0ed;
  --surface: #fbfcfb;
  --surface-2: #e3e8e4;
  --ink: #15201a;
  --ink-2: #45534a;
  --ink-3: #6b7a71;
  --line: #cfd8d2;
  --felt: #2f7356;
  --felt-2: #215a42;
  --rail: #4a3527;
  --felt-ink: #eaf4ee;
  --chip-face: #f7f5ef;
  --chip-ink: #1d2420;
  --accent: #2a6bc4;
  --accent-soft: #dce7f7;
  --on-accent: #ffffff;
  --series-2: #c48a0e;
  --danger: #b8352b;
  --danger-soft: #f7e0dd;
  --caution: #a8551b;
  --caution-soft: #f6e6d6;
  --seq-low: #e7eef8;
  --seq-high: #1c4f99;
  --focus: #2a6bc4;
  --shadow: #15201a26;
  --act-jam: #6b46a8;
  --act-raise-large: #c2416b;
  --act-raise-small: #d39a17;
  --act-passive: #2e8b57;
  --act-fold: #b9c4cc;
  --rg-empty: #e6ebe7;
  --rg-muted: #d3dad5;
  --rg-cell-label: #fbfcfbd9;
  --diff-more: #2a6bc4;
  --diff-less: #c48a0e;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-body: "Public Sans", "Segoe UI", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713;
    --surface: #17201b;
    --surface-2: #202b25;
    --ink: #e5ece7;
    --ink-2: #a9b7ae;
    --ink-3: #7f8e85;
    --line: #2d3a32;
    --felt: #24573f;
    --felt-2: #183f2d;
    --rail: #3a2a1f;
    --felt-ink: #dcebe2;
    --chip-face: #ece9e0;
    --chip-ink: #1d2420;
    --accent: #4f8ce0;
    --accent-soft: #1d2e47;
    --on-accent: #0c1420;
    --series-2: #b8860b;
    --danger: #ef7a6d;
    --danger-soft: #45221e;
    --caution: #e8955c;
    --caution-soft: #3d2b1b;
    --seq-low: #1b2633;
    --seq-high: #7fb0f0;
    --act-jam: #8f72dc;
    --act-raise-large: #d95584;
    --act-raise-small: #b08712;
    --act-passive: #2b9a86;
    --act-fold: #3d4a52;
    --rg-empty: #1e2924;
    --rg-muted: #2a3530;
    --rg-cell-label: #17201bd1;
    --diff-more: #4f8ce0;
    --diff-less: #b8860b;
    --focus: #7fb0f0;
    --shadow: #00000066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713;
  --surface: #17201b;
  --surface-2: #202b25;
  --ink: #e5ece7;
  --ink-2: #a9b7ae;
  --ink-3: #7f8e85;
  --line: #2d3a32;
  --felt: #24573f;
  --felt-2: #183f2d;
  --rail: #3a2a1f;
  --felt-ink: #dcebe2;
  --chip-face: #ece9e0;
  --chip-ink: #1d2420;
  --accent: #4f8ce0;
  --accent-soft: #1d2e47;
  --on-accent: #0c1420;
  --series-2: #b8860b;
  --danger: #ef7a6d;
  --danger-soft: #45221e;
  --caution: #e8955c;
  --caution-soft: #3d2b1b;
  --seq-low: #1b2633;
  --seq-high: #7fb0f0;
  --act-jam: #8f72dc;
  --act-raise-large: #d95584;
  --act-raise-small: #b08712;
  --act-passive: #2b9a86;
  --act-fold: #3d4a52;
  --rg-empty: #1e2924;
  --rg-muted: #2a3530;
  --rg-cell-label: #17201bd1;
  --diff-more: #4f8ce0;
  --diff-less: #b8860b;
  --focus: #7fb0f0;
  --shadow: #00000066;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
.page { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
@media (min-width: 720px) { .page { padding-inline: 28px; } }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
p { margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Header and settings */
.setting { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.setting-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.chop-control { display: flex; align-items: center; gap: 8px; }
.chop-control input { width: 120px; accent-color: var(--accent); }
.chop-value { min-width: 3.5em; font-family: var(--font-display); font-weight: 600; }

/* Segmented radio controls */
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 2px; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.segmented label { padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.segmented input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.segmented input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }

/* Panels */
.workbench { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "table" "answer" "odds"; }
@media (min-width: 900px) {
  .workbench { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-areas: "table answer" "odds answer"; align-items: start; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.area-table { grid-area: table; }
.area-answer { grid-area: answer; }
.area-odds { grid-area: odds; }

/* The felt table */
.table-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1.3; }
@media (min-width: 520px) { .table-wrap { aspect-ratio: 1.55; } }
.felt {
  position: absolute; inset: 17% 15%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 38%, var(--felt), var(--felt-2));
  box-shadow: 0 0 0 7px var(--rail), 0 0 0 8px var(--line);
  display: grid; place-content: center; text-align: center; color: var(--felt-ink); padding: 8px;
}
.felt-line { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.felt-sub { font-size: 12px; opacity: 0.85; }
.felt-pill { justify-self: center; display: inline-flex; align-items: center; margin-top: 4px; border: 0; border-radius: 999px; padding: 2px 10px; background: #ffffff24; color: inherit; font-size: 12px; cursor: pointer; }
.tier-dot.mode-solved { background: var(--felt-ink); }
.tier-dot.mode-blend { background: linear-gradient(90deg, var(--felt-ink) 50%, transparent 50%); box-shadow: inset 0 0 0 1px var(--felt-ink); }
.tier-dot.mode-rough { box-shadow: inset 0 0 0 1px var(--felt-ink); }
.felt-flag { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chip-face); background: var(--danger); border-radius: 4px; padding: 1px 8px; justify-self: center; margin-top: 4px; }
.seat {
  position: absolute; transform: translate(-50%, -50%);
  width: clamp(56px, 15%, 78px); aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  display: grid; place-content: center; justify-items: center; gap: 1px; cursor: pointer; padding: 0;
  box-shadow: 0 1px 2px var(--shadow);
  transition: border-color 0.15s, background-color 0.15s;
}
.seat:hover { border-color: var(--ink-3); }
.seat-pos { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-2); line-height: 1; }
.seat-count { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1; }
.pips { display: flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink-3); background: transparent; }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.seat.is-me { border: 3px solid var(--accent); background: var(--accent-soft); }
.seat.at-three { border-color: var(--caution); background: var(--caution-soft); }
.seat.at-four { border-color: var(--danger); background: var(--danger-soft); }
.seat.at-four .seat-count { color: var(--danger); }
.seat.at-four .pips i.on { background: var(--danger); border-color: var(--danger); }
.seat.is-me.at-three, .seat.is-me.at-four { border-width: 3px; border-color: var(--accent); }
.seat-tag {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 0 5px; line-height: 15px;
}
.dealer {
  position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%;
  background: var(--chip-face); color: var(--chip-ink); border: 2px solid var(--rail);
  font: 700 11px/18px var(--font-display); text-align: center; pointer-events: none;
  transition: left 0.2s, top 0.2s;
}
.builder-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px;
  font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink);
}
.preset:hover { border-color: var(--ink-3); }
.preset[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Answer for me */
.who { font-size: 13px; color: var(--ink-2); }
.flag {
  border: 1px solid var(--danger); background: var(--danger-soft); color: var(--ink);
  border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px;
}
.flag strong { color: var(--danger); font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; font-size: 14px; }
.hero { display: grid; gap: 4px; }
.hero-number { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hero-value { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.01em; }
.hero-unit { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--ink-2); }
.hero-caption { color: var(--ink-2); font-size: 14px; max-width: 46ch; }
.alert-pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px;
  font-size: 13px; font-weight: 600; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);
  justify-self: start;
}
.alert-pill.caution { background: var(--caution-soft); color: var(--caution); border-color: var(--caution); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) and (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.stat dt { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.stat dd { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.rule-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; justify-self: start; }
.swing-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.swing-row { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 4.8em 4.4em; align-items: center; gap: 8px; font-size: 13px; }
.swing-who { display: grid; line-height: 1.2; min-width: 0; }
.swing-who b { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.swing-who span { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.swing-row.at-four .swing-who b { color: var(--danger); }
.swing-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.swing-base, .swing-extra { position: absolute; top: 0; bottom: 0; }
.swing-base { left: 0; background: var(--ink-3); opacity: 0.45; border-radius: 3px 0 0 3px; }
.swing-extra { background: var(--danger); border-radius: 0 3px 3px 0; }
.swing-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.swing-value { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-align: right; }
.swing-denial { color: var(--ink-3); font-size: 12px; }
.swing-denial.positive { color: var(--danger); font-weight: 600; }
.swing-head { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 4.8em 4.4em; gap: 8px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.swing-head span:nth-child(n+3) { text-align: right; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.swatch.base { background: var(--ink-3); opacity: 0.45; }
.swatch.extra { background: var(--danger); }
.swatch.tick { width: 2px; height: 12px; background: var(--ink); }
.swatch.s1 { background: var(--accent); }
.swatch.s2 { background: var(--series-2); }

/* Pot odds */
.odds-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.odds-inputs .wide { grid-column: 1 / -1; }
@media (min-width: 560px) { .odds-inputs { grid-template-columns: 1fr 1fr 1.4fr; } .odds-inputs .wide { grid-column: auto; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; min-height: 38px;
}
.odds-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.odds-result { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.odds-result.with-squid { border-color: var(--accent); background: var(--accent-soft); }
.odds-result span { font-size: 12px; color: var(--ink-3); }
.odds-result b { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.05; }
.odds-scale { position: relative; height: 26px; }
.odds-rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--surface-2); border-radius: 2px; }
.odds-mark { position: absolute; top: 4px; width: 3px; height: 18px; transform: translateX(-50%); border-radius: 2px; }
.odds-mark.plain { background: var(--ink-3); }
.odds-mark.squid { background: var(--accent); }
.odds-span { position: absolute; top: 11px; height: 4px; background: var(--accent); opacity: 0.35; }
.odds-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.small-print { font-size: 12px; color: var(--ink-3); max-width: 70ch; }

/* Every seat strip */
.seat-strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 520px) { .seat-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.strip-cell { border-radius: 6px; padding: 8px 4px; text-align: center; display: grid; gap: 1px; border: 2px solid transparent; }
.strip-cell.is-me { border-color: var(--accent); }
.strip-pos { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.strip-value { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.strip-meta { font-size: 11px; opacity: 0.85; }

/* Charts */
.charts { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chart-note { font-size: 12px; color: var(--ink-3); }
.hbars { display: grid; gap: 5px; }
.hbar { display: grid; grid-template-columns: 10.5em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 13px; text-align: left; background: none; border: 0; padding: 2px 0; border-radius: 4px; cursor: pointer; color: var(--ink); }
.hbar:hover .hbar-fill { filter: brightness(1.08); }
.hbar-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hbar-track { height: 14px; position: relative; }
.hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 3px 3px 0; }
.hbar.current .hbar-label { color: var(--ink); font-weight: 700; }
.hbar:not(.current) .hbar-fill { opacity: 0.55; }
.hbar-value { font-family: var(--font-display); font-weight: 600; text-align: right; font-size: 15px; }
.grid-lines { position: relative; height: 16px; margin-left: calc(10.5em + 8px); margin-right: calc(3.4em + 8px); font-size: 13px; color: var(--ink-3); }
.grid-lines span { position: absolute; transform: translateX(-50%); font-size: 11px; }
.heat-wrap { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 300px; }
.heat th { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 2px 4px; }
.heat td { text-align: center; border-radius: 5px; padding: 9px 2px; font-family: var(--font-display); font-weight: 600; font-size: 16px; border: 2px solid transparent; }
.heat td.now { border-color: var(--ink); }
.heat caption { caption-side: bottom; text-align: left; font-size: 12px; color: var(--ink-3); padding-top: 6px; }
.columns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 170px; border-bottom: 1px solid var(--line); }
.column-group { display: flex; align-items: end; justify-content: center; gap: 3px; height: 100%; }
.column { width: min(22px, 42%); position: relative; border-radius: 3px 3px 0 0; }
.column.s1 { background: var(--accent); }
.column.s2 { background: var(--series-2); }
.column-value { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; padding-bottom: 2px; font-family: var(--font-display); font-weight: 600; }
.column-labels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: var(--ink-2); text-align: center; }
.pair-bars { display: grid; gap: 7px; }
.pair-row { display: grid; grid-template-columns: 10.5em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.pair-row > span:first-child { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-stack { display: grid; gap: 2px; }
.pair-line { display: flex; align-items: center; gap: 6px; height: 11px; }
.pair-fill { height: 100%; border-radius: 0 3px 3px 0; min-width: 2px; }
.pair-fill.s1 { background: var(--accent); }
.pair-fill.s2 { background: var(--series-2); }
.pair-value { font-size: 11px; color: var(--ink-2); font-family: var(--font-display); font-weight: 600; }

/* Method note */
details.method { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.method summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
details.method ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; max-width: 72ch; color: var(--ink-2); font-size: 14px; }
.footer { font-size: 12px; color: var(--ink-3); }
.secondary { font-size: 12px; color: var(--ink-3); font-family: var(--font-body); font-weight: 500; white-space: nowrap; }
.hero-secondary { font-size: 15px; }
.real-line { font-size: 14px; color: var(--ink-2); max-width: 92ch; border-left: 3px solid var(--felt); padding-left: 10px; }
.real-line b { color: var(--ink); font-weight: 600; }
.cell-stack { display: grid; justify-items: end; line-height: 1.15; }
.cell-stack .secondary { font-size: 10.5px; }

/* Chinese: CJK has no capitals, so drop the tracking used for English uppercase labels */
:lang(zh-CN) .setting-label, :lang(zh-CN) h3, :lang(zh-CN) .rule-tag, :lang(zh-CN) .swing-head, :lang(zh-CN) .flag strong, :lang(zh-CN) .felt-flag { letter-spacing: 0; }
:lang(zh-CN) .hero-caption, :lang(zh-CN) .small-print, :lang(zh-CN) .chart-note { line-height: 1.65; }

@media (max-width: 420px) {
  .hero-value { font-size: 48px; }
  .swing-row, .swing-head { grid-template-columns: 6em minmax(0, 1fr) 4.4em 4.1em; gap: 6px; }
  .hbar { grid-template-columns: 8.2em minmax(0, 1fr) 3.4em; }
  .pair-row { grid-template-columns: 8.2em minmax(0, 1fr); }
  .heat td { font-size: 14px; padding-inline: 1px; }
  .grid-lines { margin-left: calc(8.2em + 8px); margin-right: calc(3.4em + 8px); }
}

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; margin-bottom: -1px; cursor: pointer; font: 600 17px/1.2 var(--font-display); color: var(--ink-3); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--felt); }
.view { display: grid; gap: 20px; min-width: 0; }

/* Tutorial */
.tutorial { max-width: 860px; }
.tut-intro { font-size: 16px; color: var(--ink-2); max-width: 70ch; }
.tut p { max-width: 72ch; }
.tut h2 { display: flex; align-items: baseline; gap: 10px; }
.tut-step { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--felt-ink); background: var(--felt); border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-content: center; flex: none; }
.formula { font-family: var(--font-display); font-size: 17px; line-height: 1.5; background: var(--surface-2); border-radius: 6px; padding: 8px 12px; overflow-x: auto; max-width: 100%; }
.formula i { font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; font-style: italic; }
.tut-check { color: var(--ink-2); font-size: 14px; }
.tut-more summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.tut-more[open] { display: grid; gap: 10px; }
.table-scroll { overflow-x: auto; max-width: 100%; }
.tut-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tut-table th, .tut-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tut-table th:first-child, .tut-table td:first-child { text-align: left; white-space: normal; min-width: 8.5em; }
.tut-table thead th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.tut-table tr.total td { font-weight: 700; border-bottom: 0; }
.tut-table td.highlight { color: var(--accent); font-weight: 700; }
.vbars { display: grid; gap: 6px; }
.vbar-row { display: grid; grid-template-columns: minmax(0, 9em) 3.6em minmax(0, 1fr) 6.4em; gap: 8px; align-items: center; font-size: 13px; }
.vbar-row.no-chance { grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 6.4em; }
.vbar-row.long { grid-template-columns: 3.6em minmax(0, 1fr) 6.4em; }
.vbar-row.long .vbar-label { grid-column: 1 / -1; color: var(--ink); }
.vbar-row.summary { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.vbar-label { min-width: 0; color: var(--ink-2); }
.vbar-row.summary .vbar-label { color: var(--ink); }
.vbar-chance { text-align: right; color: var(--ink-3); font-family: var(--font-display); }
.vbar-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.vbar-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.vbar-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.vbar-fill.positive { background: var(--accent); }
.vbar-fill.negative { background: var(--series-2); }
.vbar-value { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.formula-sheet { display: grid; gap: 4px; margin: 0; }
.formula-sheet dt { font-weight: 700; margin-top: 10px; }
.formula-sheet dd { margin: 0; }
.formula-sheet dd.example { font-size: 13px; color: var(--ink-2); }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 10px; max-width: 72ch; }
.rules b { color: var(--ink); }
@media (max-width: 420px) {
  .vbar-row { grid-template-columns: minmax(0, 6.6em) 3.2em minmax(0, 1fr) 5.4em; gap: 6px; }
  .vbar-row.no-chance { grid-template-columns: minmax(0, 7.6em) minmax(0, 1fr) 5.4em; }
  .vbar-row.long { grid-template-columns: 3.2em minmax(0, 1fr) 5.4em; }
  .formula { font-size: 15px; }
}

/* Ranges */
@media (min-width: 900px) { .rg-main { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
.rg-grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; aspect-ratio: 1; max-width: 100%; width: 100%; }
.rg-cell { position: relative; border: 0; border-radius: 2px; padding: 1px; display: flex; align-items: flex-start; justify-content: flex-start; cursor: pointer; min-width: 0; overflow: hidden; background: var(--rg-empty); }
.rg-cell span { font: 600 clamp(8px, 1.15vw, 12px)/1.15 var(--font-display); color: var(--ink); background: var(--rg-cell-label); border-radius: 2px; padding: 0 2px; white-space: nowrap; }
.rg-cell:hover, .rg-cell.selected { outline: 2px solid var(--ink); outline-offset: -1px; z-index: 1; }
.rg-cell.flag::after { content: ""; position: absolute; right: 2px; bottom: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1.5px var(--surface); }
.grp-jam { background: var(--act-jam); }
.grp-raise_large { background: var(--act-raise-large); }
.grp-raise_small { background: var(--act-raise-small); }
.grp-passive { background: var(--act-passive); }
.grp-fold { background: var(--act-fold); }
.rg-sample-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--caution); border: 1px dashed var(--caution); border-radius: 3px; padding: 0 5px; }
@media (max-width: 420px) {
  .rg-grid { gap: 1px; }
  .rg-cell span { font-size: 8px; padding: 0 1px; }
}

/* Plain-poker layer: takeaways, differences strip, advanced settings, glossary, sample banner */
.takeaway { font-size: 15px; font-weight: 600; color: var(--ink); border-left: 3px solid var(--felt); padding-left: 10px; max-width: 70ch; }
.takeaway:empty { display: none; }
.diff-strip { display: grid; gap: 10px; }
.diff-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.diff-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.diff-card h3 { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 16px; }
.diff-card p { font-size: 14px; color: var(--ink-2); }
.diff-card b { color: var(--ink); font-family: var(--font-display); font-size: 16px; }
.advanced { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; background: var(--surface); }
.advanced summary { cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.advanced[open] { padding-bottom: 10px; }
.advanced-body { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 8px; }
:lang(zh-CN) .advanced summary { letter-spacing: 0; }
.glossary-list { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 6px 16px; margin: 10px 0 0; font-size: 14px; max-width: 80ch; }
.glossary-list dt { font-weight: 700; }
.glossary-list dd { margin: 0; color: var(--ink-2); }
@media (max-width: 520px) { .glossary-list { grid-template-columns: minmax(0, 1fr); gap: 2px; } .glossary-list dd { margin-bottom: 8px; } }

.rg-round-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--felt); border: 1px solid var(--felt); border-radius: 3px; padding: 0 5px; }
:lang(zh-CN) .rg-round-tag { letter-spacing: 0; }

/* Main screen: compact header, squid monitor, action bar, one big grid, compact legend */
.m-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.brand { font-size: 20px; }
.m-top .tabs { border-bottom: 0; }
.tab-help { min-width: 36px; font-size: 18px; }
.m-toggles { display: flex; gap: 8px; }
.calc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.view.main { gap: 12px; }
.m-context { display: flex; flex-wrap: wrap; gap: 6px; }
.m-pill { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--surface); }
.m-pill.is-sample { color: var(--caution); border: 1px dashed var(--caution); background: var(--caution-soft); }
.m-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .m-layout { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } }
.m-left, .m-range { display: grid; gap: 10px; min-width: 0; }
.m-table { aspect-ratio: 1.35; }
.m-table .seat-tag { top: -13px; }
.seat-bounty { font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--ink-2); line-height: 1; }
.m-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.m-reset { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.m-bar { list-style: none; margin: 0; padding: 4px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.m-bar li { flex: none; }
.m-sep { color: var(--ink-3); }
.m-step { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; font-size: 13px; white-space: nowrap; cursor: pointer; color: var(--ink); }
.m-step b { font-family: var(--font-display); }
.m-step.is-fold { color: var(--ink-3); }
.m-step.is-current { background: var(--ink); color: var(--surface); border-color: var(--ink); cursor: default; }
.m-step.is-end { cursor: default; color: var(--ink-3); }
.m-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.m-act { border: 1px solid var(--line); border-left-width: 6px; background: var(--surface); border-radius: 8px; padding: 10px 8px; font: 600 15px/1.1 var(--font-display); cursor: pointer; color: var(--ink); }
.m-act:hover { background: var(--surface-2); }
.grp-edge-fold { border-left-color: var(--act-fold); }
.grp-edge-passive { border-left-color: var(--act-passive); }
.grp-edge-raise_small { border-left-color: var(--act-raise-small); }
.grp-edge-raise_large { border-left-color: var(--act-raise-large); }
.grp-edge-jam { border-left-color: var(--act-jam); }
.m-missing { font-size: 13px; color: var(--ink-3); }
.m-badge { display: flex; align-items: center; font-size: 13px; color: var(--ink-2); cursor: help; }
.tier-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; }
.tier-dot.tier-normal { background: var(--act-passive); }
.tier-dot.tier-directional { background: var(--caution); }
.tier-dot.tier-unreliable { background: var(--ink-3); }
.m-grid-wrap { position: relative; }
.m-grid.is-sample { filter: saturate(0.45); }
.m-pop { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 20px var(--shadow); display: grid; gap: 4px; z-index: 2; }
.m-pop-tie { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }
.m-pop-head { font-size: 14px; padding-right: 24px; }
.m-pop-head b { font-family: var(--font-display); font-size: 18px; margin-right: 6px; }
.m-pop-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 13px; }
.m-pop-row b { font-family: var(--font-display); }
.m-pop-close { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink-2); }
.m-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.m-key { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--ink); }
.m-key b { font-family: var(--font-display); }
.m-key small, .m-pop-row small { color: var(--ink-3); }
.m-key[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.m-more summary { cursor: pointer; font-size: 13px; color: var(--ink-3); }
.m-more-body { display: grid; gap: 10px; margin-top: 8px; }
.m-notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>


<div class="page">
  <header class="m-top">
    <h1 class="brand" data-i18n="brand"></h1>
    <div class="tabs" role="tablist" data-i18n-aria="tabs_aria">
      <button type="button" class="tab" role="tab" id="tab-ranges" aria-controls="view-ranges" aria-selected="true" data-i18n="tab_ranges"></button>
      <button type="button" class="tab" role="tab" id="tab-calc" aria-controls="view-calc" aria-selected="false" tabindex="-1" data-i18n="tab_calc"></button>
      <button type="button" class="tab tab-help" role="tab" id="tab-how" aria-controls="view-how" aria-selected="false" tabindex="-1" data-i18n-aria="tab_how">?</button>
    </div>
    <div class="m-toggles">
      <div class="segmented" role="radiogroup" data-i18n-aria="units_label">
        <input type="radio" name="unit" id="unit-chips" value="chips" checked>
        <label for="unit-chips" data-i18n="unit_chips"></label>
        <input type="radio" name="unit" id="unit-bb" value="bb">
        <label for="unit-bb" data-i18n="unit_bb"></label>
      </div>
      <div class="segmented" role="radiogroup" data-i18n-aria="language_label">
        <input type="radio" name="language" id="lang-en" value="en" checked>
        <label for="lang-en" lang="en" data-i18n="lang_en"></label>
        <input type="radio" name="language" id="lang-zh" value="zh">
        <label for="lang-zh" lang="zh-CN" data-i18n="lang_zh"></label>
      </div>
    </div>
  </header>

  <div class="view main" id="view-ranges" role="tabpanel" aria-labelledby="tab-ranges">
    <p class="m-context"><span class="m-pill" id="m-model" hidden></span><span class="m-pill is-sample" id="m-sample" data-i18n="m_sample" hidden></span></p>
    <div class="m-layout">
      <section class="m-left" data-i18n-aria="m_monitor">
        <div class="table-wrap m-table" id="m-table-wrap"><div class="felt" id="m-felt"></div></div>
        <div class="m-controls">
          <div class="segmented" role="radiogroup" data-i18n-aria="mode_aria">
            <input type="radio" name="m-mode" id="m-mode-squids" value="squids" checked>
            <label for="m-mode-squids" data-i18n="m_mode_squids"></label>
            <input type="radio" name="m-mode" id="m-mode-button" value="button">
            <label for="m-mode-button" data-i18n="m_mode_button"></label>
            <input type="radio" name="m-mode" id="m-mode-me" value="me">
            <label for="m-mode-me" data-i18n="m_mode_me"></label>
          </div>
          <button type="button" class="m-reset" id="m-reset" data-i18n="m_reset"></button>
        </div>
        <ol class="m-bar" id="m-bar" data-i18n-aria="m_hand"></ol>
        <div class="m-actions" id="m-actions"></div>
        <p class="m-missing" id="m-missing" hidden></p>
        <p class="m-missing" id="m-locked" data-i18n="m_locked" hidden></p>
      </section>
      <section class="m-range" id="m-range" data-i18n-aria="rg_grid_aria">
        <p class="m-badge" id="m-badge"></p>
        <div class="m-grid-wrap">
          <div class="rg-grid m-grid" id="m-grid" role="group" data-i18n-aria="rg_grid_aria"></div>
          <div class="m-pop" id="m-pop" hidden></div>
        </div>
        <ul class="m-legend" id="m-legend"></ul>
      </section>
    </div>
    <details class="m-more" id="m-more">
      <summary data-i18n="m_more"></summary>
      <div class="m-more-body">
        <div class="setting" id="m-model-row" hidden>
          <span class="setting-label" id="m-model-label" data-i18n="m_model"></span>
          <div class="segmented" role="radiogroup" aria-labelledby="m-model-label">
            <input type="radio" name="m-model" id="m-model-real" value="real" checked>
            <label for="m-model-real" data-i18n="m_model_real"></label>
            <input type="radio" name="m-model" id="m-model-round1" value="round1">
            <label for="m-model-round1" data-i18n="m_model_round1"></label>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label" id="m-real-label" data-i18n="rg_realisation"></span>
          <div class="segmented" role="radiogroup" aria-labelledby="m-real-label">
            <input type="radio" name="m-real" id="m-real-low" value="low">
            <label for="m-real-low" data-i18n="rg_real_low"></label>
            <input type="radio" name="m-real" id="m-real-calibrated" value="calibrated" checked>
            <label for="m-real-calibrated" data-i18n="rg_real_calibrated"></label>
            <input type="radio" name="m-real" id="m-real-high" value="high">
            <label for="m-real-high" data-i18n="rg_real_high"></label>
          </div>
        </div>
        <ul class="m-notes" id="m-notes"></ul>
      </div>
    </details>
  </div>

  <div class="view" id="view-calc" role="tabpanel" aria-labelledby="tab-calc" hidden>
  <div class="calc-head">
    <p class="muted" id="subtitle"></p>
      <details class="advanced" id="advanced-settings">
      <summary data-i18n="advanced_label"></summary>
      <div class="advanced-body">
        <div class="setting">
          <span class="setting-label" id="model-label" data-i18n="model_label"></span>
          <div class="segmented" role="radiogroup" aria-labelledby="model-label">
            <input type="radio" name="win-model" id="model-uniform" value="uniform" checked>
            <label for="model-uniform" data-i18n="model_uniform"></label>
            <input type="radio" name="win-model" id="model-position" value="position_weighted">
            <label for="model-position" data-i18n="model_position"></label>
          </div>
        </div>
        <div class="setting">
          <label class="setting-label" for="chop-rate" data-i18n="chop_label"></label>
          <div class="chop-control">
            <input type="range" id="chop-rate" min="0" max="5" step="0.5" value="0">
            <output class="chop-value" id="chop-value" for="chop-rate">0%</output>
          </div>
        </div>
      </div>
    </details>
  </div>
  <section class="diff-strip" aria-labelledby="diff-title">
    <h2 id="diff-title" data-i18n="diff_title"></h2>
    <div class="diff-cards" id="diff-cards"></div>
    <p class="small-print" data-i18n="rules_line"></p>
  </section>

  <div class="workbench">
    <section class="panel area-table" aria-labelledby="table-title">
      <div class="panel-head">
        <h2 id="table-title" data-i18n="table_title"></h2>
        <div class="segmented" role="radiogroup" data-i18n-aria="mode_aria">
          <input type="radio" name="tap-mode" id="mode-squids" value="squids" checked>
          <label for="mode-squids" data-i18n="mode_squids"></label>
          <input type="radio" name="tap-mode" id="mode-button" value="button">
          <label for="mode-button" data-i18n="mode_button"></label>
          <input type="radio" name="tap-mode" id="mode-me" value="me">
          <label for="mode-me" data-i18n="mode_me"></label>
        </div>
      </div>
      <div class="table-wrap" id="table-wrap">
        <div class="felt" id="felt"></div>
      </div>
      <p class="muted" id="tap-hint"></p>
      <div class="builder-row">
        <span class="setting-label" data-i18n="presets_label"></span>
        <div class="presets" id="presets"></div>
      </div>
    </section>

    <section class="panel area-answer" aria-labelledby="answer-title" aria-live="polite">
      <div class="panel-head">
        <h2 id="answer-title" data-i18n="answer_title"></h2>
        <span class="who" id="who"></span>
      </div>
      <p class="takeaway" id="take-answer"></p>
      <div class="flag" id="flag" hidden>
        <strong data-i18n="flag_title"></strong>
        <span id="flag-reason"></span>
      </div>
      <div class="hero">

<script>
// Layer 1 squid value engine: a direct JavaScript port of value_engine/markov_value.py (rules from rules/squid_rules.py).
(function (root) {
  "use strict";

  const NUM_PLAYERS = 8;
  const TOTAL_SQUIDS = 10;
  const PAY_PER_SQUID = 100;
  const JACKPOT_THRESHOLD = 5;
  const JACKPOT_PER_PLAYER = 1000;
  const FIRST_POT_SQUIDS = 2; // head fish (头鱼两条, John 2026-10-06): the round's first squid pot pays 2
  const CHIPS_PER_BB = 50;

  // position name for each seat offset from the button (offset 0 = the button itself), 8-handed only
  const POSITION_BY_OFFSET_FROM_BUTTON = ["BTN", "SB", "BB", "UTG", "UTG+1", "MP", "HJ", "CO"];

  // ILLUSTRATIVE GUESS at non-chopped-pot win share by position (sums to 1.0), not measured data
  const ILLUSTRATIVE_WIN_SHARE_BY_POSITION = {
    UTG: 0.10, "UTG+1": 0.10, MP: 0.11, HJ: 0.12, CO: 0.13, BTN: 0.16, SB: 0.10, BB: 0.18,
  };

  const ENDING_NAMES = ["jackpot", "1 loser", "2 losers", "3 losers", "4 losers", "5 losers", "6 losers", "7 losers"];

  // main payload per (counts, button): 8 seat values (chips), 8 ending probabilities, 1 expected hands left
  const VALUE = 0;
  const ENDING = 8;
  const HANDS = 16;
  const MAIN_PAYLOAD = 17;

  // one hero's final settlement split by source: collected as a holder, paid as a 0-squid loser, jackpot (chips), then P(hero pays), P(hero wins the jackpot)
  const PART_NAMES = ["collected", "paid", "jackpot", "p_pay", "p_my_jackpot"];

  // squid counts are encoded as a base-6 number so a child state's key is the parent's key plus 6^winner
  const POWERS_OF_SIX = Array.from({ length: NUM_PLAYERS }, (_, seat) => 6 ** seat);

  const sum = (numbers) => numbers.reduce((total, number) => total + number, 0);
  const players_without_squid = (counts) => counts.filter((count) => count === 0).length;
  const key_of = (counts) => sum(counts.map((count, seat) => count * POWERS_OF_SIX[seat]));

  /** The 8-handed position name of a seat, given where the button sits. */
  function position_name(seat, button_seat) {
    return POSITION_BY_OFFSET_FROM_BUTTON[(seat - button_seat + NUM_PLAYERS) % NUM_PLAYERS];
  }

  /** Win probability per seat for the next hand; they sum to 1 - chop. */
  function win_probabilities(model, chop, button_seat) {
    return Array.from({ length: NUM_PLAYERS }, (_, seat) =>
      model === "uniform"
        ? (1 - chop) / NUM_PLAYERS
        : ILLUSTRATIVE_WIN_SHARE_BY_POSITION[position_name(seat, button_seat)] * (1 - chop));
  }

  /** Throws for a squid-count vector the real game can never reach (Python's _validate_squid_counts). */
  function validate_squid_counts(counts) {
    if (counts.length !== NUM_PLAYERS) throw new Error(`expected ${NUM_PLAYERS} seats, got ${counts.length}`);
    if (!counts.every((count) => Number.isInteger(count) && count >= 0)) throw new Error(`squid counts must be whole numbers >= 0: ${counts}`);
    if (sum(counts) > TOTAL_SQUIDS) throw new Error(`squid counts sum to ${sum(counts)}, more than ${TOTAL_SQUIDS}`);
    if (players_without_squid(counts) === 0) throw new Error(`every player holds a squid, which can never happen: ${counts}`);
    if (counts.filter((count) => count >= JACKPOT_THRESHOLD).length >= 2) throw new Error(`two players at or above the jackpot: ${counts}`);
    if (counts.some((count) => count > JACKPOT_THRESHOLD)) throw new Error(`a player is above the jackpot threshold: ${counts}`);
  }

  /** Every zero-squid player pays every holder 100 x that holder's squids. */
  function settlement_payoffs(counts) {
    const losers = players_without_squid(counts);
    const squids_out = sum(counts);
    return counts.map((count) => (count > 0 ? PAY_PER_SQUID * count * losers : -PAY_PER_SQUID * squids_out));
  }

  /** The payoff vector if the round has ended at this state, else null (brief 1.3, checked in order). */
  function settle_round(counts) {
    const jackpot_winner = counts.findIndex((count) => count >= JACKPOT_THRESHOLD);
    if (jackpot_winner >= 0) {
      // corrected rule (John, 2026-10-03): only the zero-squid players pay the jackpot; holders pay nothing
      const zero_squid_players = players_without_squid(counts);
      return counts.map((count, seat) => {
        if (seat === jackpot_winner) return JACKPOT_PER_PLAYER * zero_squid_players;
        return count === 0 ? -JACKPOT_PER_PLAYER : 0;
      });
    }
    if (players_without_squid(counts) === 1 || sum(counts) === TOTAL_SQUIDS) return settlement_payoffs(counts);
    return null;
  }

  /** Index into ENDING_NAMES for a state where the round just ended. */
  function ending_index(counts) {
    return counts.some((count) => count >= JACKPOT_THRESHOLD) ? 0 : players_without_squid(counts);
  }

  /** Squids the next pot pays: the head fish while none are out (a chop passes it on), then 1. */
  const squids_for_next_pot = (counts) => (sum(counts) === 0 ? FIRST_POT_SQUIDS : 1);

  /** New squid counts after one hand; a null winner is a chop, which changes nothing. */
  function award_squid(counts, pot_winner) {
    return counts.map((count, seat) => (seat === pot_winner ? count + squids_for_next_pot(counts) : count));
  }

  /** Solve V[b] = self_loop[b] * V[b+1] + known[b] around the button cycle, exactly, for payloads of the given size. */
  function solve_button_cycle(self_loop, known, size) {
    const values = new Float64Array(known.length);
    // unroll from button 0: V[0] = sum_k (q_0...q_{k-1}) K[k] + (q_0...q_7) V[0]
    let loop_weight = 1;
    for (let button = 0; button < NUM_PLAYERS; button++) {
      for (let d = 0; d < size; d++) values[d] += loop_weight * known[button * size + d];
      loop_weight *= self_loop[button];
    }
    for (let d = 0; d < size; d++) values[d] /= 1 - loop_weight;
    for (let button = NUM_PLAYERS - 1; button >= 1; button--) {
      const next = ((button + 1) % NUM_PLAYERS) * size;
      for (let d = 0; d < size; d++) values[button * size + d] = self_loop[button] * values[next + d] + known[button * size + d];
    }
    return values;
  }

  /** The one recursion behind every public method, for any payload: returns payload_at(counts, button) plus a solved-state count. */
  function create_solver(win_by_button, chop, size, ended_payload, hand_index) {
    const solved = new Map();
    const terminal_cache = new Map();

    /** The ended_payload of a state where the round is over (cached), else null. */
    function terminal_payload(counts, key) {
      if (terminal_cache.has(key)) return terminal_cache.get(key);
      const payload = settle_round(counts) ? ended_payload(counts) : null;
      terminal_cache.set(key, payload);
      return payload;
    }

    /** 8 rows of size numbers, row b for button b. */
    function solve(counts, key) {
      const cached = solved.get(key);
      if (cached) return cached;
      const known = new Float64Array(NUM_PLAYERS * size);
      // our game has no per-player cap, so only a chop leaves the counts unchanged
      const self_loop = new Float64Array(NUM_PLAYERS).fill(chop);
      const won = squids_for_next_pot(counts);
      for (let button = 0; button < NUM_PLAYERS; button++) {
        const row = button * size;
        const next_row = ((button + 1) % NUM_PLAYERS) * size;
        if (hand_index >= 0) known[row + hand_index] += 1;
        for (let winner = 0; winner < NUM_PLAYERS; winner++) {
          const probability = win_by_button[button][winner];
          if (probability === 0) continue;
          counts[winner] += won;
          const child_key = key + won * POWERS_OF_SIX[winner];
          const terminal = terminal_payload(counts, child_key);
          const child = terminal || solve(counts, child_key);
          const offset = terminal ? 0 : next_row;
          for (let d = 0; d < size; d++) known[row + d] += probability * child[offset + d];
          counts[winner] -= won;
        }
      }
      const result = solve_button_cycle(self_loop, known, size);
      solved.set(key, result);
      return result;
    }

    /** The payload for (counts, button): solved row, or the ended payload if the round is already over. */
    function payload_at(counts, button_seat) {
      validate_squid_counts(counts);
      const key = key_of(counts);
      const terminal = terminal_payload(counts, key);
      if (terminal) return terminal;
      const start = button_seat * size;
      return solve(counts.slice(), key).subarray(start, start + size);
    }

    return { payload_at, solved_count: () => solved.size };
  }

  /** Settlement plus one-hot ending (0 hands left) for a round that has ended. */
  function main_ended_payload(counts) {
    const payload = new Float64Array(MAIN_PAYLOAD);
    payload.set(settle_round(counts), VALUE);
    payload[ENDING + ending_index(counts)] = 1;
    return payload;
  }

  /** One hero's settlement split by source, for a round that has ended. */
  function parts_ended_payload(counts, hero) {
    const payload = new Float64Array(PART_NAMES.length);
    const jackpot_winner = counts.findIndex((count) => count >= JACKPOT_THRESHOLD);
    if (jackpot_winner >= 0) {
      payload[2] = settle_round(counts)[hero];
      payload[4] = jackpot_winner === hero ? 1 : 0;
    } else if (counts[hero] > 0) {
      payload[0] = settle_round(counts)[hero];
    } else {
      payload[1] = settle_round(counts)[hero];
      payload[3] = 1;
    }
    return payload;
  }

  /** An engine for one win model ("uniform" or "position_weighted") and chop rate, with its own cache. */
  function create_engine(model = "uniform", chop = 0) {
    if (!(chop >= 0 && chop < 1)) throw new Error(`chop must be in [0, 1), got ${chop}`);
    if (model !== "uniform" && model !== "position_weighted") throw new Error(`unknown win model ${model}`);
    const win_by_button = Array.from({ length: NUM_PLAYERS }, (_, button) => win_probabilities(model, chop, button));
    const main = create_solver(win_by_button, chop, MAIN_PAYLOAD, main_ended_payload, HANDS);
    const payload_at = main.payload_at;
    const parts_by_hero = new Map();

    /** V(counts, button): expected final settlement per seat, chips. */
    function expected_payoffs(counts, button_seat) {
      return Array.from(payload_at(counts, button_seat).subarray(VALUE, VALUE + NUM_PLAYERS));
    }

    /** V(award_squid(counts, pot_winner), button + 1), chips; a null pot_winner is a chop. */
    function value_after_hand(counts, button_seat, pot_winner) {
      const next_counts = pot_winner === null ? counts : award_squid(counts, pot_winner);
      return expected_payoffs(next_counts, (button_seat + 1) % NUM_PLAYERS);
    }

    /** Hero's average value, chips, if one of the other seats wins this pot. */
    function value_if_opponent_wins(counts, button_seat, hero) {
      const opponents = [...Array(NUM_PLAYERS).keys()].filter((seat) => seat !== hero);
      return sum(opponents.map((opponent) => value_after_hand(counts, button_seat, opponent)[hero])) / opponents.length;
    }

    /** BB: hero's value from winning this pot minus hero's average value from an opponent winning it. */
    function implicit_ante(counts, button_seat, hero) {
      const value_if_hero_wins = value_after_hand(counts, button_seat, hero)[hero];
      return (value_if_hero_wins - value_if_opponent_wins(counts, button_seat, hero)) / CHIPS_PER_BB;
    }

    /** BB hero loses if pot_winner specifically wins this pot, versus an average opponent winning it. */
    function denial_cost(counts, button_seat, hero, pot_winner) {
      const value_if_pot_winner_wins = value_after_hand(counts, button_seat, pot_winner)[hero];
      return (value_if_opponent_wins(counts, button_seat, hero) - value_if_pot_winner_wins) / CHIPS_PER_BB;
    }

    /** P(round ends each way) from this state onward, keyed by ENDING_NAMES. */
    function ending_probabilities(counts, button_seat) {
      const payload = payload_at(counts, button_seat);
      return Object.fromEntries(ENDING_NAMES.map((name, index) => [name, payload[ENDING + index]]));
    }

    /** Expected number of hands still to be played before this round ends. */
    function expected_hands_remaining(counts, button_seat) {
      return payload_at(counts, button_seat)[HANDS];
    }

    /** Hero's expected final settlement split by source (chips) plus P(hero pays) and P(hero wins the jackpot); the money parts sum to V. */
    function settlement_parts(counts, button_seat, hero) {
      if (!parts_by_hero.has(hero)) {
        parts_by_hero.set(hero, create_solver(win_by_button, chop, PART_NAMES.length, (ended) => parts_ended_payload(ended, hero), -1));
      }
      const payload = parts_by_hero.get(hero).payload_at(counts, button_seat);
      return Object.fromEntries(PART_NAMES.map((name, index) => [name, payload[index]]));
    }

    /** settlement_parts after one hand with this pot winner (null = a chop). */
    function parts_after_hand(counts, button_seat, pot_winner, hero) {
      const next_counts = pot_winner === null ? counts : award_squid(counts, pot_winner);
      return settlement_parts(next_counts, (button_seat + 1) % NUM_PLAYERS, hero);
    }

    /** Solve every state reachable from the fresh round at once (others solve when asked). */
    function solve_all() {
      payload_at(Array(NUM_PLAYERS).fill(0), 0);
      return main.solved_count();
    }

    return {
      model, chop, win_probabilities: (button_seat) => win_by_button[button_seat].slice(), solve_all, expected_payoffs,
      value_after_hand, implicit_ante, denial_cost, ending_probabilities, expected_hands_remaining, settlement_parts, parts_after_hand,
    };
  }

  const api = {
    NUM_PLAYERS, TOTAL_SQUIDS, JACKPOT_THRESHOLD, CHIPS_PER_BB, ENDING_NAMES, PART_NAMES, ILLUSTRATIVE_WIN_SHARE_BY_POSITION,
    position_name, settle_round, validate_squid_counts, award_squid, create_engine,
  };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.SquidEngine = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
// Every number the "How it works" tab prints, computed from a solved engine (money in BB, chances as 0-1).
(function (root) {
  "use strict";

  const NUM_PLAYERS = 8;
  const CHIPS_PER_BB = 50;
  const FRESH = [0, 0, 0, 0, 0, 0, 0, 0];
  // hero is seat 0 in every example; opponents sit clockwise from hero
  const HERO = 0;

      engine_ante: engine.implicit_ante(counts, button, hero),
      value_now: in_bb(engine.expected_payoffs(counts, button)[hero]),

  }

    const step = one_step(engine, FRESH, button, HERO);
    const parts_win = parts_in_bb(engine.parts_after_hand(FRESH, button, HERO, HERO));
    const parts_opponent = mean_parts(opponents_of(HERO).map((seat) => parts_in_bb(engine.parts_after_hand(FRESH, button, seat, HERO))));
    const parts_now = parts_in_bb(engine.settlement_parts(FRESH, button, HERO));

      ante: step.ante,
      value_if_i_win: step.value_if_i_win,
      value_if_opponent_wins: step.value_if_opponent_wins,
      seven_eighths: (7 / 8) * step.ante,
      parts_win, parts_opponent, parts_now,
      expected_payers,
      multiple: dead_money_multiple(step.ante, table),
      stack: table.stack_bb / dead_money_multiple(step.ante, table),
      blinds_multiple: step.ante / table.posts_bb,

  }

  function last_squid(engine, button, settle_round) {
    const step = one_step(engine, LAST_SQUID, button, HERO);
    const other_zero = LAST_SQUID.findIndex((count, seat) => count === 0 && seat !== HERO);
    const holders = opponents_of(HERO).filter((seat) => seat !== other_zero);
    const branches = {
      me: { chance: step.outcomes[HERO].chance, value: step.outcomes[HERO].value },
      other_zero: { chance: step.outcomes[other_zero].chance, value: step.outcomes[other_zero].value },
      holder: { chance: sum(holders.map((seat) => step.outcomes[seat].chance)), value: mean(holders.map((seat) => step.outcomes[seat].value)) },
    };
    const table = TWO_ON_ZERO.map((counts) => {
      const after_i_win = counts.map((count, seat) => (seat === HERO ? count + 1 : count));
      return {
        squids_out: sum(counts),
        counts,
        loser_bill: -in_bb(settle_round(after_i_win).find((_, seat) => after_i_win[seat] === 0)),
        ante: engine.implicit_ante(counts, button, HERO),
      };
    });
    return {
      counts: LAST_SQUID, branches, table,
      swing: step.ante,
      penalty_avoided: -step.value_if_opponent_wins,
      collected: step.value_if_i_win,

  }

  /** Hero on 4 (V(I win) is the jackpot itself), then a villain on 4 with hero on 0. */
  function jackpot(engine, button, table = ROUND1_TABLE) {

    const later = mean(opponents_of(HERO).map((seat) => engine.parts_after_hand(HERO_ON_FOUR, button, seat, HERO).p_my_jackpot));
    const villain = VILLAIN_ON_FOUR.findIndex((count) => count === 4);
    const villain_step = one_step(engine, VILLAIN_ON_FOUR, button, HERO);
    return {
      on_four: {
        value_if_i_win: hero_step.value_if_i_win,
        value_if_opponent_wins: hero_step.value_if_opponent_wins,
        ante: hero_step.ante,
        chance_of_jackpot_later: later,
        multiple: dead_money_multiple(hero_step.ante, table),
        stack: table.stack_bb / dead_money_multiple(hero_step.ante, table),
      },
      villain_on_four: {
        value_if_i_win: villain_step.value_if_i_win,
        value_if_opponent_wins: villain_step.value_if_opponent_wins,
        value_if_villain_wins: villain_step.outcomes[villain].value,
        ante: villain_step.ante,
        denial: engine.denial_cost(VILLAIN_ON_FOUR, button, HERO, villain),

  /** Pot odds with and without the squid: equity needed = call / (pot + call [+ swing]). */
  function pot_odds(pot, call, swing) {
    return { plain: call / (pot + call), with_squid: call / (pot + call + swing) };
  }

  /** The closer (BB, or the straddle) defending a single open, with a fresh squid as the swing: pot = open + posts, call = open - own post. */
  function big_blind_defence(fresh_ante, table = ROUND1_TABLE) {
    const pot = table.open_bb + table.posts_bb;
    const call = table.open_bb - table.closer_post_bb;
    return { open: table.open_bb, pot, call, ...pot_odds(pot, call, fresh_ante) };
  }

  /** QuintAce Stand-up swing 6 * val / (N - 1), at the start (N = 6) and with two left (N = 2). */
  function standup_swing() {

  /** {type, opener, size, hero, three_bettor, actor} from a spot id like "vs_open:CO:2.5:BB" (or a line: id). */
  function parse_spot(spot) {
    if (spot.startsWith("line:")) return { type: "line", actor: spot.split(">")[1] };
    const [type, a, b, c] = spot.split(":");
    if (type === "first") return { type, hero: a, actor: a };
    if (type === "vs_open") return { type, opener: a, size: Number(b), hero: c, actor: c };

  function spot_steps(spot) {

    const open = (seat, size) => ({ seat, kind: "raise", to_bb: size });
    if (parsed.type === "first") return { steps: [], actor: parsed.actor };
    if (parsed.type === "vs_open") return { steps: [open(parsed.opener, parsed.size)], actor: parsed.actor };
    if (parsed.type === "vs_3bet") return { steps: [open(parsed.opener, parsed.size), open(parsed.three_bettor, null)], actor: parsed.actor };

      const seat = token.slice(0, dot);
      const action = token.slice(dot + 1);

    if (!steps.length) return `first:${actor}`;
    if (steps.length === 1 && raises.length === 1) return `vs_open:${steps[0].seat}:${steps[0].to_bb}:${actor}`;
    if (steps.length === 2 && raises.length === 2 && steps[0].seat === actor) return `vs_3bet:${actor}:${steps[0].to_bb}:${steps[1].seat}`;
    return `line:${steps.map((step) => `${step.seat}.${TOKEN_OF_KIND[step.kind]}${step.kind === "raise" ? step.to_bb : ""}`).join(",")}>${actor}`;

  function pot_so_far(node) {

  /** Colour group of each action at a node (see ranges_schema.md). */
  function action_groups(node) {

    return node.actions.map((action, index) => {

      const changes = offsets_a.map((row, winner) => row[player] - offsets_b[winner][player]);

    })));
  }

  const same_seats = (a, b, count) => a.every((value, seat) => (value === count) === (b[seat] === count));
  /** True when every anchor holder also holds in the target, and then the on-4 rule (same hunters and zeros, at most 1 squid moved) or else no seat 2+ squids apart. */
  function may_stand_in(anchor_squids, squids) {
    if (squids.some((count, seat) => count === 0 && anchor_squids[seat] > 0)) return false;
    if (!squids.includes(4)) return squids.every((count, seat) => Math.abs(count - anchor_squids[seat]) < 2);
    const moved = squids.reduce((sum, count, seat) => sum + Math.abs(count - anchor_squids[seat]), 0);
    return same_seats(anchor_squids, squids, 4) && same_seats(anchor_squids, squids, 0) && moved <= 1;
  }

  /** Solve the square system by Gaussian elimination with partial pivoting; null when it is singular. */
  function solve_system(matrix, vector) {
    const size = vector.length;
    const rows = matrix.map((row, at) => [...row, vector[at]]);
    for (let column = 0; column < size; column++) {
      const pivot = rows.reduce((best, _, at) => (at >= column && Math.abs(rows[at][column]) > Math.abs(rows[best][column]) ? at : best), column);
      if (rows[pivot][column] === 0) return null;
      [rows[column], rows[pivot]] = [rows[pivot], rows[column]];
      for (let at = column + 1; at < size; at++) {
        const factor = rows[at][column] / rows[column][column];
        for (let k = column; k <= size; k++) rows[at][k] -= factor * rows[column][k];
      }
    }
    const solution = Array(size).fill(0);
    for (let at = size - 1; at >= 0; at--) solution[at] = (rows[at][size] - rows[at].slice(at + 1, size).reduce((sum, value, k) => sum + value * solution[at + 1 + k], 0)) / rows[at][at];
    return solution;
  }

  const dot = (a, b) => a.reduce((sum, value, at) => sum + value * b[at], 0);

  /** Weights summing to 1 whose mix of the points is closest to the target, by least squares; null if degenerate. */
  function affine_weights(target, points) {
    if (points.length === 1) return [1];
    const steps = points.slice(1).map((point) => point.map((value, at) => value - points[0][at]));
    const rest = solve_system(steps.map((row) => steps.map((other) => dot(row, other))), steps.map((row) => dot(row, target.map((value, at) => value - points[0][at]))));
    return rest && [1 - rest.reduce((a, b) => a + b, 0), ...rest];
  }

  /** Every way to pick `size` of 0..count-1, in itertools.combinations order. */
  function combinations(count, size) {
    if (size === 0) return [[]];
    return Array.from({ length: count }, (_, first) => first).flatMap((first) => combinations(count - first - 1, size - 1).map((rest) => [first, ...rest.map((at) => at + first + 1)]));
  }

  /** Weights >= 0 summing to 1 that best fit the target: the best affine fit over every subset, smallest subsets first (a near tie keeps the earlier one). */
  function convex_weights(target, points) {
    let best = null;
    let best_residual = Infinity;
    for (let size = 1; size <= points.length; size++) {
      for (const subset of combinations(points.length, size)) {
        const chosen = subset.map((at) => points[at]);
        const weights = affine_weights(target, chosen);
        if (!weights || Math.min(...weights) < 0) continue;
        const residual = target.reduce((sum, value, at) => sum + (weights.reduce((mixed, weight, k) => mixed + weight * chosen[k][at], 0) - value) ** 2, 0);
        if (residual < best_residual * (1 - 1e-9)) {
          best = Array(points.length).fill(0);
          subset.forEach((at, k) => { best[at] = weights[k]; });
          best_residual = residual;
        }
      }
    }
    return best;
  }

  /** {mode: solved | blend | rough, anchors: indices, weights, nearest, distance}: how a target squid state is shown, from its offsets and the anchors'. */
  function blend_weights(target_counts, target_offsets, anchor_counts, anchor_offsets, radius = RADIUS_CHIPS) {
    const distance = anchor_offsets.map((offsets) => column_range_distance(target_offsets, offsets));
    const compatible = anchor_counts.map((counts) => may_stand_in(counts, target_counts));
    const on_four = target_counts.includes(4);
    // on 4 with nothing compatible, the page shows the nearest anchor with the hunter in the same seat (validation.md)
    const hunter_moved = anchor_counts.map((counts) => on_four && !same_seats(counts, target_counts, 4));
    const by_rank = anchor_counts.map((_, at) => at).sort((a, b) => (compatible[b] - compatible[a]) || (hunter_moved[a] - hunter_moved[b]) || (distance[a] - distance[b]) || (a - b));
    const nearest = by_rank[0];
    const result = { nearest, distance: distance[nearest] };
    if (anchor_counts[nearest].join() === target_counts.join()) return { mode: "solved", anchors: [nearest], weights: [1], ...result };
    if (on_four && compatible[nearest]) return { mode: "blend", anchors: [nearest], weights: [1], ...result };
    const near = by_rank.filter((at) => compatible[at] && distance[at] <= radius).slice(0, MAX_BLEND_ANCHORS);
    if (!near.length) return { mode: "rough", anchors: [nearest], weights: [1], ...result };
    const weights = convex_weights(target_offsets.flat(), near.map((at) => anchor_offsets[at].flat()));
    return { mode: "blend", anchors: near.filter((_, k) => weights[k] > 0), weights: weights.filter((weight) => weight > 0), ...result };
  }

  /** The page's view of blend_weights: {mode, anchors: [{id, weight, gap}], gap} from the manifest's anchors ({id, squids, offsets}). */
  function pick_blend(anchors, offsets, squids) {
    const choice = blend_weights(squids, offsets, anchors.map((anchor) => anchor.squids), anchors.map((anchor) => anchor.offsets));
    return { mode: choice.mode, gap: choice.distance,
      anchors: choice.anchors.map((at, k) => ({ id: anchors[at].id, weight: choice.weights[k], gap: column_range_distance(offsets, anchors[at].offsets) })) };
  }

  const api = {
    GROUPS, COMBOS, parse_spot, spot_steps, canonical_spot, pot_so_far, hand_rules, start_hand, hand_after, next_to_act, replay, spot_of, path_to, action_groups, action_labels, decision, range_weight, summary, main_action,

  };

/** The table's money facts from the active data set, in engine BB (50 chips): posts, the closer's post, smallest open, stack, display BB in chips. */
function table_facts() {
  const display_chips = RANGES.chips_per_bb || CHIPS_PER_BB;
  const blinds = RANGES.blinds || { SB: 0.5, BB: 1 };
  const engine_bb = (data_bb) => (data_bb * display_chips) / CHIPS_PER_BB;
  const closer = RANGES.positions[RANGES.positions.length - 1];
  return {
    display_chips, closer, posts_bb: engine_bb(sum(Object.values(blinds))), closer_post_bb: engine_bb(blinds[closer] || 1),
    open_bb: engine_bb(RANGES.open_bb || 2.5), stack_bb: engine_bb(RANGES.stack_bb || 600),
  };
}

/** Page text in the current language, with {name} placeholders filled from values. */
function t(key, values = {}) {
  const text = (STRINGS[state.language][key] ?? STRINGS.en[key]).replace(/\{(\w+)\}/g, (_, name) => String(values[name]));
  // Chinese: drop a space left between two Chinese characters by a filled-in amount ("587 筹码 赏金" -> "587 筹码赏金")
  return state.language === "zh" ? text.replace(/([\u4e00-\u9fff]) (?=[\u4e00-\u9fff])/g, "$1") : text;
}

const seat_label = (seat) => t("seat", { n: seat + 1 });
const squids_text = (count) => (count === 1 ? t("squids_one") : t("squids_many", { n: count }));
const preset_name = (preset) => t(`name_${preset.id}`);

// Units: every amount is computed in BB and shown in BB or chips (1 BB = 50 chips).
const other_unit = () => (state.unit === "bb" ? "chips" : "bb");
const unit_name = (unit = state.unit) => t(unit === "bb" ? "unit_bb" : "unit_chips");

/** A BB amount as a bare number in the given unit (chips are whole and comma-grouped). */
function number_in(bb, unit = state.unit, digits = 1) {
  // bb is in engine BB (50 chips); shown BB are the table's (25 chips in the real game)
  return unit === "bb" ? fixed((bb * CHIPS_PER_BB) / table_facts().display_chips, digits) : Math.round(bb * CHIPS_PER_BB).toLocaleString("en-US");
}

/** A BB amount with its unit, e.g. "12.6 BB" or "630 chips". */
const amount = (bb, unit = state.unit, digits = 1) => `${number_in(bb, unit, digits)} ${unit_name(unit)}`;
/** The same amount in the other unit, as a small "≈" label. */
const also = (bb, digits = 1) => `≈ ${amount(bb, other_unit(), digits)}`;
/** A signed amount, e.g. "+6.4" or "−1.1". */
const signed = (bb, unit = state.unit, digits = 1) => `${bb >= 0 ? "+" : "−"}${number_in(Math.abs(bb), unit, digits)}`;

/** Round a chart maximum up to a tidy tick step. */
function nice_max(value, step) {
  return Math.max(step, Math.ceil(value / step) * step);
}

// Engines: one per (model, chop), each solves the whole reachable graph once on first use.
const engines = new Map();

/** The solved engine for the current settings, creating and solving it if new. */
function current_engine() {
  const key = `${state.model}|${state.chop}`;
  if (!engines.has(key)) {
    const started = performance.now();
    const engine = create_engine(state.model, state.chop / 100);
    engine.solve_all();
    engine.solve_ms = performance.now() - started;
    engines.set(key, engine);
    if (engines.size > 4) engines.delete(engines.keys().next().value);
  }
  return engines.get(key);
}

/** Why this table cannot be a mid-round decision point, in plain words, or null if it can. */
function state_problem(counts) {
  const over = counts.findIndex((count) => count >= 5);
  if (over >= 0) return t("problem_jackpot", { seat: over + 1, n: counts[over] });
  const squids_out = sum(counts);
  if (squids_out >= 10) return t("problem_ten_out", { n: squids_out });
  const at_zero = counts.filter((count) => count === 0).length;
  if (at_zero === 1) return t("problem_one_zero");
  if (at_zero === 0) return t("problem_no_zero");
  return null;
}

/** Preset counts placed clockwise from my seat. */
function counts_from_me(preset_counts, me) {
  const counts = Array(NUM_PLAYERS).fill(0);
  preset_counts.forEach((count, step) => { counts[(me + step) % NUM_PLAYERS] = count; });
  return counts;
}

/** The preset matching the current table, if any. */
function matching_preset() {
  return PRESETS.find((preset) => counts_from_me(preset.counts, state.me).every((count, seat) => count === state.counts[seat]));
}

// Persistence: per-viewer convenience only, so every failure is ignored.
function save_state() {
  try {
    const { counts, button, me, model, chop, unit, pot, call } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ counts, button, me, model, chop, unit, pot, call }));
    localStorage.setItem(LANGUAGE_KEY, state.language);
  } catch (error) { /* storage blocked: nothing to remember */ }
}

function load_state() {
  const browser_language = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
  state.language = browser_language;
  try {
    const saved_language = localStorage.getItem(LANGUAGE_KEY);
    if (saved_language === "en" || saved_language === "zh") state.language = saved_language;
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    const is_seat = (value) => Number.isInteger(value) && value >= 0 && value < NUM_PLAYERS;
    const good_counts = saved && Array.isArray(saved.counts) && saved.counts.length === NUM_PLAYERS
      && saved.counts.every((count) => Number.isInteger(count) && count >= 0 && count <= 4);
    if (!good_counts || !is_seat(saved.button) || !is_seat(saved.me)) return;
    Object.assign(state, {
      counts: saved.counts, button: saved.button, me: saved.me,
      model: saved.model === "position_weighted" ? "position_weighted" : "uniform",
      chop: Math.min(5, Math.max(0, Number(saved.chop) || 0)),
      unit: saved.unit === "bb" ? "bb" : "chips",
      pot: Number(saved.pot) >= 0 ? Number(saved.pot) : state.pot,
      call: Number(saved.call) >= 0 ? Number(saved.call) : state.call,
    });
  } catch (error) { /* storage blocked or corrupt: keep the opening state */ }
}

// The felt table: 8 seats clockwise on an ellipse, seat 1 at the bottom.
const seat_buttons = [];
let dealer_chip;

/** Point on an ellipse around the table centre, in percent of the table box. */
function table_point(seat, radius_x, radius_y) {
  const angle = Math.PI / 2 + (seat * 2 * Math.PI) / NUM_PLAYERS;
  return { left: 50 + radius_x * Math.cos(angle), top: 50 + radius_y * Math.sin(angle) };
}

function build_table() {
  const wrap = $("table-wrap");
  for (const seat of SEATS) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "seat";
    button.id = `seat-${seat}`;
    const point = table_point(seat, 39, 37);
    button.style.left = `${point.left}%`;
    button.style.top = `${point.top}%`;
    button.addEventListener("click", () => tap_seat(seat));
    wrap.appendChild(button);
    seat_buttons.push(button);
  }
  dealer_chip = document.createElement("div");
  dealer_chip.className = "dealer";
  dealer_chip.textContent = "D";
  dealer_chip.setAttribute("aria-hidden", "true");
  wrap.appendChild(dealer_chip);
}

function tap_seat(seat) {
  if (state.mode === "squids") state.counts[seat] = (state.counts[seat] + 1) % 5;
  if (state.mode === "button") state.button = seat;
  if (state.mode === "me") state.me = seat;
  if (state.mode !== "squids") set_mode("squids");
  if (state.villain === state.me) state.villain = null;
  update();
}

function set_mode(mode) {

function render_table() {

    const pips = [0, 1, 2, 3].map((index) => `<i class="${index < count ? "on" : ""}"></i>`).join("");

      + `<span class="seat-count">${count}</span><span class="pips">${pips}</span>`;

    button.setAttribute("aria-label", t("seat_aria", { seat: seat_label(seat), position: position_of(seat), squids: squids_text(count) }) + marks);

// The read-out for "me".
/** Everything the page shows about the current state, from one engine (amounts in BB). */
function read_state(engine) {
  const { counts, button, me } = state;
  const value_if_i_win = engine.value_after_hand(counts, button, me)[me];
  return {
    ante: engine.implicit_ante(counts, button, me),
    swings: opponents_of(me).map((seat) => ({
      seat,
      swing: (value_if_i_win - engine.value_after_hand(counts, button, seat)[me]) / CHIPS_PER_BB,
      denial: engine.denial_cost(counts, button, me, seat),
    })),
    endings: engine.ending_probabilities(counts, button),
    hands_left: engine.expected_hands_remaining(counts, button),
    seat_antes: SEATS.map((seat) => engine.implicit_ante(counts, button, seat)),
  };
}

/** "What's different from normal poker?": four cards, every number from the live engine via SquidTutorial. */
function render_differences(engine) {
  const button = button_for_my_position();
  const table = table_facts();
  const fresh = SquidTutorial.fresh_round(engine, button, table);
