const SENSITIVITY = [{"preset":"fresh","position_only_bb":0.26340000000000074,"model_only_bb":0.14939999999999998},{"preset":"holders","position_only_bb":1.3810000000000002,"model_only_bb":0.9337000000000018},{"preset":"z2","position_only_bb":1.665799999999999,"model_only_bb":0.15529999999999866},{"preset":"me3","position_only_bb":4.089100000000002,"model_only_bb":0.39099999999999824},{"preset":"me4","position_only_bb":6.405799999999999,"model_only_bb":2.061300000000003},{"preset":"villain4","position_only_bb":1.1327999999999996,"model_only_bb":0.5588000000000015},{"preset":"villain4me1","position_only_bb":0.7426000000000004,"model_only_bb":0.4593000000000007},{"preset":"desperate","position_only_bb":0,"model_only_bb":0}];
// Squid Value Lab page logic: the table builder, the read-out for "me", pot odds and context charts, all from engine.js.
"use strict";

const { create_engine, position_name, NUM_PLAYERS, CHIPS_PER_BB } = SquidEngine;
const SEATS = [...Array(NUM_PLAYERS).keys()];
const STACK_BB = 600;
const BLINDS_BB = 1.5;
const BLINDS_CHIPS = 75;
const STORAGE_KEY = "squid-value-lab-state";
const LANGUAGE_KEY = "squid-value-lab-language";
const CJK_FONT_URL = "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap";

// ending categories shown in the chart: engine name plus number of losers (0 = jackpot); 6 or 7 losers cannot happen
const ENDINGS_SHOWN = [
  { name: "jackpot", losers: 0 }, { name: "1 loser", losers: 1 }, { name: "2 losers", losers: 2 },
  { name: "3 losers", losers: 3 }, { name: "4 losers", losers: 4 }, { name: "5 losers", losers: 5 },
];

// the brief's key states, my squids first, then opponents clockwise from me (labels live in strings.js)
const PRESETS = [
  { id: "fresh", counts: [0, 0, 0, 0, 0, 0, 0, 0] },
  { id: "holders", counts: [0, 1, 1, 1, 1, 0, 0, 0] },
  { id: "z2", counts: [0, 1, 1, 1, 1, 1, 1, 0] },
  { id: "me3", counts: [3, 0, 0, 0, 0, 0, 0, 0] },
  { id: "me4", counts: [4, 0, 0, 0, 0, 0, 0, 0] },
  { id: "villain4", counts: [0, 4, 0, 0, 0, 0, 0, 0] },
  { id: "villain4me1", counts: [1, 4, 0, 0, 0, 0, 0, 0] },
  { id: "desperate", counts: [0, 4, 1, 1, 1, 1, 1, 0] },
];

// opening state: "villain on 4" with me in the CO (button one seat clockwise of me); pot and call are kept in BB
const state = {
  counts: [0, 4, 0, 0, 0, 0, 0, 0], button: 1, me: 0, mode: "squids",
  model: "uniform", chop: 0, unit: "bb", language: "en", pot: 12, call: 8, villain: null,
};

const $ = (id) => document.getElementById(id);
const sum = (numbers) => numbers.reduce((total, number) => total + number, 0);
const fixed = (number, digits = 1) => number.toFixed(digits);
const percent = (p) => (Math.abs(p) < 1e-12 ? "0%" : p < 0.01 && p > 0 ? `${(100 * p).toFixed(2)}%` : `${(100 * p).toFixed(1)}%`);
const opponents_of = (seat) => SEATS.filter((other) => other !== seat);
const clockwise_from = (seat) => SEATS.map((step) => (seat + step) % NUM_PLAYERS);
const position_of = (seat) => position_name(seat, state.button);

/** Page text in the current language, with {name} placeholders filled from values. */
function t(key, values = {}) {
  const text = STRINGS[state.language][key] ?? STRINGS.en[key];
  return text.replace(/\{(\w+)\}/g, (_, name) => String(values[name]));
}

const seat_label = (seat) => t("seat", { n: seat + 1 });
const squids_text = (count) => (count === 1 ? t("squids_one") : t("squids_many", { n: count }));
const preset_name = (preset) => t(`name_${preset.id}`);

// Units: every amount is computed in BB and shown in BB or chips (1 BB = 50 chips).
const other_unit = () => (state.unit === "bb" ? "chips" : "bb");
const unit_name = (unit = state.unit) => t(unit === "bb" ? "unit_bb" : "unit_chips");

/** A BB amount as a bare number in the given unit (chips are whole and comma-grouped). */
function number_in(bb, unit = state.unit, digits = 1) {
  return unit === "bb" ? fixed(bb, digits) : Math.round(bb * CHIPS_PER_BB).toLocaleString("en-US");
}

/** A BB amount with its unit, e.g. "12.6 BB" or "630 chips". */
const amount = (bb, unit = state.unit, digits = 1) => `${number_in(bb, unit, digits)} ${unit_name(unit)}`;
/** The same amount in the other unit, as a small "≈" label. */
const also = (bb, digits = 1) => `≈ ${amount(bb, other_unit(), digits)}`;
/** A signed amount, e.g. "+6.4" or "−1.1". */
const signed = (bb, unit = state.unit, digits = 1) => `${bb >= 0 ? "+" : "−"}${number_in(Math.abs(bb), unit, digits)}`;

/** Round a chart maximum up to a tidy tick step. */
function nice_max(value, step) {
  return Math.max(step, Math.ceil(value / step) * step);
}

// Engines: one per (model, chop), each solves the whole reachable graph once on first use.
const engines = new Map();

/** The solved engine for the current settings, creating and solving it if new. */
function current_engine() {
  const key = `${state.model}|${state.chop}`;
  if (!engines.has(key)) {
    const started = performance.now();
    const engine = create_engine(state.model, state.chop / 100);
    engine.solve_all();
    engine.solve_ms = performance.now() - started;
    engines.set(key, engine);
    if (engines.size > 4) engines.delete(engines.keys().next().value);
  }
  return engines.get(key);
}

/** Why this table cannot be a mid-round decision point, in plain words, or null if it can. */
function state_problem(counts) {
  const over = counts.findIndex((count) => count >= 5);
  if (over >= 0) return t("problem_jackpot", { seat: over + 1, n: counts[over] });
  const squids_out = sum(counts);
  if (squids_out >= 10) return t("problem_ten_out", { n: squids_out });
  const at_zero = counts.filter((count) => count === 0).length;
  if (at_zero === 1) return t("problem_one_zero");
  if (at_zero === 0) return t("problem_no_zero");
  return null;
}

/** Preset counts placed clockwise from my seat. */
function counts_from_me(preset_counts, me) {
  const counts = Array(NUM_PLAYERS).fill(0);
  preset_counts.forEach((count, step) => { counts[(me + step) % NUM_PLAYERS] = count; });
  return counts;
}

/** The preset matching the current table, if any. */
function matching_preset() {
  return PRESETS.find((preset) => counts_from_me(preset.counts, state.me).every((count, seat) => count === state.counts[seat]));
}

// Persistence: per-viewer convenience only, so every failure is ignored.
function save_state() {
  try {
    const { counts, button, me, model, chop, unit, pot, call } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ counts, button, me, model, chop, unit, pot, call }));
    localStorage.setItem(LANGUAGE_KEY, state.language);
  } catch (error) { /* storage blocked: nothing to remember */ }
}

function load_state() {
  const browser_language = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
  state.language = browser_language;
  try {
    const saved_language = localStorage.getItem(LANGUAGE_KEY);
    if (saved_language === "en" || saved_language === "zh") state.language = saved_language;
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    const is_seat = (value) => Number.isInteger(value) && value >= 0 && value < NUM_PLAYERS;
    const good_counts = saved && Array.isArray(saved.counts) && saved.counts.length === NUM_PLAYERS
      && saved.counts.every((count) => Number.isInteger(count) && count >= 0 && count <= 4);
    if (!good_counts || !is_seat(saved.button) || !is_seat(saved.me)) return;
    Object.assign(state, {
      counts: saved.counts, button: saved.button, me: saved.me,
      model: saved.model === "position_weighted" ? "position_weighted" : "uniform",
      chop: Math.min(5, Math.max(0, Number(saved.chop) || 0)),
      unit: saved.unit === "chips" ? "chips" : "bb",
      pot: Number(saved.pot) >= 0 ? Number(saved.pot) : state.pot,
      call: Number(saved.call) >= 0 ? Number(saved.call) : state.call,
    });
  } catch (error) { /* storage blocked or corrupt: keep the opening state */ }
}

// Language: fill every data-i18n element, then redraw.
function load_cjk_font() {
  if ($("cjk-font")) return;
  const link = document.createElement("link");
  link.id = "cjk-font";
  link.rel = "stylesheet";
  link.href = CJK_FONT_URL;
  document.head.appendChild(link);
}

function apply_language() {
  document.documentElement.lang = state.language === "zh" ? "zh-CN" : "en";
  if (state.language === "zh") load_cjk_font();
  for (const element of document.querySelectorAll("[data-i18n]")) element.textContent = t(element.dataset.i18n);
  for (const element of document.querySelectorAll("[data-i18n-html]")) element.innerHTML = t(element.dataset.i18nHtml);
  for (const element of document.querySelectorAll("[data-i18n-aria]")) element.setAttribute("aria-label", t(element.dataset.i18nAria));
  for (const preset of PRESETS) $(`preset-${preset.id}`).textContent = t(`preset_${preset.id}`);
  set_mode(state.mode);
}

// The felt table: 8 seats clockwise on an ellipse, seat 1 at the bottom.
const seat_buttons = [];
let dealer_chip;

/** Point on an ellipse around the table centre, in percent of the table box. */
function table_point(seat, radius_x, radius_y) {
  const angle = Math.PI / 2 + (seat * 2 * Math.PI) / NUM_PLAYERS;
  return { left: 50 + radius_x * Math.cos(angle), top: 50 + radius_y * Math.sin(angle) };
}

function build_table() {
  const wrap = $("table-wrap");
  for (const seat of SEATS) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "seat";
    button.id = `seat-${seat}`;
    const point = table_point(seat, 39, 37);
    button.style.left = `${point.left}%`;
    button.style.top = `${point.top}%`;
    button.addEventListener("click", () => tap_seat(seat));
    wrap.appendChild(button);
    seat_buttons.push(button);
  }
  dealer_chip = document.createElement("div");
  dealer_chip.className = "dealer";
  dealer_chip.textContent = "D";
  dealer_chip.setAttribute("aria-hidden", "true");
  wrap.appendChild(dealer_chip);
}

function tap_seat(seat) {
  if (state.mode === "squids") state.counts[seat] = (state.counts[seat] + 1) % 5;
  if (state.mode === "button") state.button = seat;
  if (state.mode === "me") state.me = seat;
  if (state.mode !== "squids") set_mode("squids");
  if (state.villain === state.me) state.villain = null;
  update();
}

function set_mode(mode) {
  state.mode = mode;
  $(`mode-${mode}`).checked = true;
  $("tap-hint").textContent = t(`hint_${mode}`);
}

function render_table() {
  for (const seat of SEATS) {
    const count = state.counts[seat];
    const is_me = seat === state.me;
    const button = seat_buttons[seat];
    button.className = `seat${is_me ? " is-me" : ""}${count === 3 ? " at-three" : ""}${count >= 4 ? " at-four" : ""}`;
    const pips = [0, 1, 2, 3].map((index) => `<i class="${index < count ? "on" : ""}"></i>`).join("");
    button.innerHTML = `${is_me ? `<span class="seat-tag">${t("me_tag")}</span>` : ""}<span class="seat-pos">${position_of(seat)}</span>`
      + `<span class="seat-count">${count}</span><span class="pips">${pips}</span>`;
    const marks = `${is_me ? t("seat_aria_me") : ""}${seat === state.button ? t("seat_aria_button") : ""}`;
    button.setAttribute("aria-label", t("seat_aria", { seat: seat_label(seat), position: position_of(seat), squids: squids_text(count) }) + marks);
  }
  const chip = table_point(state.button, 23, 18);
  dealer_chip.style.left = `${chip.left}%`;
  dealer_chip.style.top = `${chip.top}%`;
  const at_zero = state.counts.filter((count) => count === 0).length;
  $("felt").innerHTML = `<span class="felt-line">${t("felt_out", { n: sum(state.counts) })}</span><span class="felt-sub">${t("felt_zero", { n: at_zero })}</span>`
    + (state_problem(state.counts) ? `<span class="felt-flag">${t("felt_flag")}</span>` : "");
  const preset = matching_preset();
  for (const chip_button of $("presets").children) {
    chip_button.setAttribute("aria-pressed", String(preset !== undefined && chip_button.dataset.preset === preset.id));
  }
}

function build_presets() {
  for (const preset of PRESETS) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.id = `preset-${preset.id}`;
    button.dataset.preset = preset.id;
    button.addEventListener("click", () => load_preset(preset));
    $("presets").appendChild(button);
  }
}

function load_preset(preset) {
  state.counts = counts_from_me(preset.counts, state.me);
  state.villain = null;
  update();
}

// The read-out for "me".
/** Everything the page shows about the current state, from one engine (amounts in BB). */
function read_state(engine) {
  const { counts, button, me } = state;
  const value_if_i_win = engine.value_after_hand(counts, button, me)[me];
  return {
    ante: engine.implicit_ante(counts, button, me),
    swings: opponents_of(me).map((seat) => ({
      seat,
      swing: (value_if_i_win - engine.value_after_hand(counts, button, seat)[me]) / CHIPS_PER_BB,
      denial: engine.denial_cost(counts, button, me, seat),
    })),
    endings: engine.ending_probabilities(counts, button),
    hands_left: engine.expected_hands_remaining(counts, button),
    seat_antes: SEATS.map((seat) => engine.implicit_ante(counts, button, seat)),
  };
}

function render_real_money(engine) {
  const fresh_ante = engine.implicit_ante(Array(NUM_PLAYERS).fill(0), button_for_my_position(), 0);
  const chips_rounded = Math.round((fresh_ante * CHIPS_PER_BB) / 10) * 10;
  $("real-line").innerHTML = t("real_money", {
    ante: `<b>${amount(fresh_ante, "bb")}</b>`,
    chips: `<b>${chips_rounded.toLocaleString("en-US")} ${unit_name("chips")}</b>`,
    multiple: Math.round((fresh_ante * CHIPS_PER_BB) / BLINDS_CHIPS),
  });
}

function render_answer(read, problem) {
  const me = state.me;
  $("who").textContent = `${position_of(me)} · ${seat_label(me)} · ${squids_text(state.counts[me])}`;
  $("flag").hidden = !problem;
  $("flag-reason").textContent = problem || "";
  $("hero-unit").textContent = unit_name();
  const dash = "–";
  if (!read) {
    for (const id of ["hero-ante", "stat-jackpot", "stat-hands", "stat-multiple", "stat-stack"]) $(id).textContent = dash;
    for (const id of ["hero-secondary", "stat-stack-secondary"]) $(id).textContent = "";
    $("swing-list").innerHTML = "";
    $("alert").hidden = true;
    return;
  }
  const multiple = (read.ante + BLINDS_BB) / BLINDS_BB;
  const stack_bb = STACK_BB / multiple;
  $("hero-ante").textContent = number_in(read.ante, state.unit, 2);
  $("hero-secondary").textContent = also(read.ante, 2);
  $("stat-jackpot").textContent = percent(read.endings.jackpot);
  $("stat-hands").textContent = fixed(read.hands_left);
  $("stat-multiple").textContent = `${fixed(multiple)}×`;
  $("stat-stack").textContent = amount(stack_bb, state.unit, 0);
  $("stat-stack-secondary").textContent = also(stack_bb, 0);
  render_alert();
  render_swings(read);
}

function render_alert() {
  const near_jackpot = opponents_of(state.me).filter((seat) => state.counts[seat] === 4);
  const on_three = opponents_of(state.me).filter((seat) => state.counts[seat] === 3);
  const seats = near_jackpot.length ? near_jackpot : on_three;
  const alert = $("alert");
  alert.hidden = seats.length === 0;
  alert.className = near_jackpot.length ? "alert-pill" : "alert-pill caution";
  const key = `${near_jackpot.length ? "alert_four" : "alert_three"}_${seats.length > 1 ? "many" : "one"}`;
  alert.textContent = t(key, { names: seats.map(position_of).join(t("names_joiner")) });
}

function render_swings(read) {
  const sorted = [...read.swings].sort((a, b) => b.swing - a.swing);
  const scale = Math.max(...sorted.map((row) => row.swing), read.ante, 1e-9);
  const width = (bb) => `${Math.max(0, (100 * bb) / scale)}%`;
  $("swing-list").innerHTML = sorted.map(({ seat, swing, denial }) => {
    const base = Math.min(read.ante, Math.max(0, swing));
    const extra = Math.max(0, swing - read.ante);
    const count = state.counts[seat];
    const title = t("swing_row_title", { position: position_of(seat), swing: amount(swing, state.unit, 2), denial: amount(denial, state.unit, 2) });
    return `<li class="swing-row${count === 4 ? " at-four" : ""}" title="${title}">`
      + `<span class="swing-who"><b>${position_of(seat)}</b><span>${seat_label(seat)} · ${t("squids_short", { n: count })}</span></span>`
      + `<span class="swing-track"><span class="swing-base" style="width:${width(base)}"></span>`
      + `<span class="swing-extra" style="left:${width(read.ante)};width:${width(extra)}"></span>`
      + `<span class="swing-tick" style="left:${width(read.ante)}"></span></span>`
      + `<span class="cell-stack"><span class="swing-value">${number_in(swing)}</span><span class="secondary">${amount(swing, other_unit())}</span></span>`
      + `<span class="cell-stack swing-denial${denial > 0.05 ? " positive" : ""}"><span>${signed(denial)}</span><span class="secondary">${signed(denial, other_unit())} ${unit_name(other_unit())}</span></span></li>`;
  }).join("");
}

// Pot odds against one villain; the inputs take the unit currently shown.
function render_odds_inputs() {
  const shown = (bb) => (state.unit === "bb" ? String(Number(bb.toFixed(2))) : String(Math.round(bb * CHIPS_PER_BB)));
  const step = state.unit === "bb" ? "0.5" : "25";
  for (const [id, bb] of [["pot-size", state.pot], ["call-amount", state.call]]) {
    $(id).value = shown(bb);
    $(id).step = step;
  }
  $("pot-label").textContent = t("pot_label", { unit: unit_name() });
  $("call-label").textContent = t("call_label", { unit: unit_name() });
}

function read_odds_inputs() {
  const per_unit = state.unit === "bb" ? 1 : CHIPS_PER_BB;
  state.pot = Number($("pot-size").value) / per_unit;
  state.call = Number($("call-amount").value) / per_unit;
}

function render_villain_options(read) {
  const select = $("villain-seat");
  if (read && (state.villain === null || state.villain === state.me)) {
    state.villain = [...read.swings].sort((a, b) => b.swing - a.swing)[0].seat;
  }
  select.innerHTML = opponents_of(state.me).map((seat) => `<option value="${seat}">`
    + `${t("villain_option", { position: position_of(seat), seat: seat_label(seat), squids: squids_text(state.counts[seat]) })}</option>`).join("");
  if (state.villain !== null) select.value = String(state.villain);
}

function render_odds(read) {
  const { pot, call } = state;
  const valid = read && pot >= 0 && call > 0;
  const row = read && read.swings.find((entry) => entry.seat === state.villain);
  const plain = valid ? call / (pot + call) : null;
  const with_squid = valid && row ? Math.min(1, Math.max(0, call / (pot + call + row.swing))) : null;
  $("odds-note").textContent = t("odds_note", { unit: unit_name() });
  $("odds-plain").textContent = plain === null ? "–" : percent(plain);
  $("odds-squid").textContent = with_squid === null ? "–" : percent(with_squid);
  for (const [id, value] of [["odds-mark-plain", plain], ["odds-mark-squid", with_squid]]) {
    $(id).hidden = value === null;
    if (value !== null) $(id).style.left = `${100 * value}%`;
  }
  const span = $("odds-span");
  span.hidden = plain === null || with_squid === null;
  if (!span.hidden) {
    span.style.left = `${100 * Math.min(plain, with_squid)}%`;
    span.style.width = `${100 * Math.abs(plain - with_squid)}%`;
  }
  $("odds-formula").textContent = row && valid
    ? t("odds_formula", { call: number_in(call), pot: number_in(pot), swing: number_in(row.swing), position: position_of(row.seat) })
    : t("odds_formula_blank");
}

// Every seat at once.
/** Background and ink for a value on the sequential blue ramp, share in [0, 1]. */
function ramp_style(share) {
  const strength = Math.round(8 + 92 * Math.min(1, Math.max(0, share)));
  const ink = strength > 55 ? "var(--on-accent)" : "var(--ink)";
  return `background:color-mix(in oklab, var(--seq-high) ${strength}%, var(--seq-low));color:${ink}`;
}

function render_strip(read) {
  const antes = read ? read.seat_antes : SEATS.map(() => null);
  const top = read ? Math.max(...antes) : 1;
  $("strip-note").textContent = t("strip_note", { unit: unit_name() });
  $("seat-strip").innerHTML = clockwise_from(0).map((seat) => {
    const ante = antes[seat];
    const style = ante === null ? "background:var(--surface-2)" : ramp_style(ante / top);
    const marks = `${seat === state.me ? `${t("strip_me")} · ` : ""}${seat === state.button ? "D · " : ""}${t("squids_short", { n: state.counts[seat] })}`;
    return `<div class="strip-cell${seat === state.me ? " is-me" : ""}" style="${style}" title="${position_of(seat)}, ${seat_label(seat)}">`
      + `<span class="strip-pos">${position_of(seat)}</span><span class="strip-value">${ante === null ? "–" : number_in(ante)}</span>`
      + `<span class="strip-meta">${ante === null ? "" : also(ante)}</span><span class="strip-meta">${marks}</span></div>`;
  }).join("");
}

// Context charts.
/** Button seat that puts hero seat 0 in my current position. */
function button_for_my_position() {
  return (NUM_PLAYERS - ((state.me - state.button + NUM_PLAYERS) % NUM_PLAYERS)) % NUM_PLAYERS;
}

function render_key_states(engine) {
  const button = button_for_my_position();
  const rows = PRESETS.map((preset) => ({ preset, ante: engine.implicit_ante(preset.counts, button, 0) }));
  const axis_max = nice_max(Math.max(...rows.map((row) => row.ante)), 20);
  const current = matching_preset();
  $("key-note").textContent = state.model === "uniform"
    ? t("key_note_any", { unit: unit_name() })
    : t("key_note_position", { unit: unit_name(), position: position_of(state.me) });
  $("key-axis").innerHTML = [0, 0.5, 1].map((share) => `<span style="left:${100 * share}%">${number_in(axis_max * share, state.unit, 0)}</span>`).join("");
  $("key-bars").innerHTML = rows.map(({ preset, ante }) =>
    `<button type="button" class="hbar${current && current.id === preset.id ? " current" : ""}" id="key-${preset.id}" data-preset="${preset.id}" title="${preset_name(preset)}: ${amount(ante, state.unit, 2)} (${also(ante, 2)})">`
    + `<span class="hbar-label">${preset_name(preset)}</span><span class="hbar-track"><span class="hbar-fill" style="width:${(100 * ante) / axis_max}%"></span></span>`
    + `<span class="hbar-value">${number_in(ante)}</span></button>`).join("");
}

function render_heatmap(engine) {
  const me = state.me;
  const villain = (me + 1) % NUM_PLAYERS;
  const levels = [0, 1, 2, 3, 4];
  const ante_at = (mine, theirs) => {
    const counts = Array(NUM_PLAYERS).fill(0);
    counts[me] = mine;
    counts[villain] = theirs;
    return engine.implicit_ante(counts, state.button, me);
  };
  const grid = levels.map((mine) => levels.map((theirs) => ante_at(mine, theirs)));
  const low = Math.min(...grid.flat());
  const high = Math.max(...grid.flat());
  const their_max = Math.max(...opponents_of(me).map((seat) => state.counts[seat]));
  const is_now = (mine, theirs) => !state_problem(state.counts) && mine === state.counts[me] && theirs === their_max;
  const header = `<tr><th scope="col">${t("heat_corner")}</th>${levels.map((level) => `<th scope="col">${level}</th>`).join("")}</tr>`;
  const body = [...levels].reverse().map((mine) => `<tr><th scope="row">${mine}</th>${levels.map((theirs) => {
    const value = grid[mine][theirs];
    const title = t("heat_cell", { mine, theirs, value: `${amount(value, state.unit, 2)} (${also(value, 2)})` });
    return `<td class="${is_now(mine, theirs) ? "now" : ""}" style="${ramp_style((value - low) / (high - low))}" title="${title}">${number_in(value)}</td>`;
  }).join("")}</tr>`).join("");
  $("heat-note").textContent = unit_name();
  $("heat").innerHTML = `<caption>${t("heat_caption", { position: position_of(villain) })}</caption>${header}${body}`;
}

function ending_label(ending, short) {
  if (ending.losers === 0) return t(short ? "ending_short_jackpot" : "ending_name_jackpot");
  if (short) return t("ending_short_losers", { n: ending.losers });
  return ending.losers === 1 ? t("ending_name_loser") : t("ending_name_losers", { n: ending.losers });
}

function render_endings(engine, read) {
  const fresh = engine.ending_probabilities(Array(NUM_PLAYERS).fill(0), button_for_my_position());
  const here = read ? read.endings : null;
  const top = nice_max(100 * Math.max(...ENDINGS_SHOWN.map(({ name }) => Math.max(fresh[name], here ? here[name] : 0))), 10);
  const column = (p, series, label) => `<span class="column ${series}" style="height:${Math.max(0.5, (100 * 100 * p) / top)}%" title="${label}: ${percent(p)}">`
    + `<span class="column-value">${(100 * p).toFixed(p < 0.01 ? 2 : 1)}</span></span>`;
  $("ending-columns").innerHTML = ENDINGS_SHOWN.map((ending) => `<div class="column-group">`
    + column(fresh[ending.name], "s2", `${t("ending_fresh")}, ${ending_label(ending, false)}`)
    + (here ? column(here[ending.name], "s1", `${t("ending_here")}, ${ending_label(ending, false)}`) : "") + "</div>").join("");
  $("ending-labels").innerHTML = ENDINGS_SHOWN.map((ending) => `<span>${ending_label(ending, true)}</span>`).join("");
  $("ending-note").textContent = t("ending_note", { hands: fixed(engine.expected_hands_remaining(Array(NUM_PLAYERS).fill(0), 0), 2), top });
}

function render_sensitivity() {
  const top = nice_max(Math.max(...SENSITIVITY.flatMap((row) => [row.position_only_bb, row.model_only_bb])), 2);
  const digits = 2;
  const line = (value, series) => `<span class="pair-line"><span class="pair-fill ${series}" style="width:${(100 * value) / top}%"></span><span class="pair-value">${number_in(value, state.unit, digits)}</span></span>`;
  $("sens-note").textContent = t("sens_unit", { unit: unit_name() });
  $("sensitivity-bars").innerHTML = SENSITIVITY.map((row) => {
    const name = t(`name_${row.preset}`);
    const title = t("sens_row_title", { state: name, position: amount(row.position_only_bb, state.unit, digits), model: amount(row.model_only_bb, state.unit, digits) });
    return `<div class="pair-row" title="${title}"><span>${name}</span><span class="pair-stack">${line(row.position_only_bb, "s1")}${line(row.model_only_bb, "s2")}</span></div>`;
  }).join("");
}

// Tabs: "calc" and "how", deep-linked by the bare hash #how.
const VIEWS = ["calc", "how"];
let current_view = "calc";

function show_view(view) {
  current_view = VIEWS.includes(view) ? view : "calc";
  for (const name of VIEWS) {
    const selected = name === current_view;
    $(`view-${name}`).hidden = !selected;
    $(`tab-${name}`).setAttribute("aria-selected", String(selected));
    $(`tab-${name}`).tabIndex = selected ? 0 : -1;
  }
  if (current_view === "how") render_tutorial(current_engine());
}

function view_from_hash() {
  return location.hash === "#how" ? "how" : "calc";
}

// The "How it works" tab: every figure comes from SquidTutorial, which reads the solved engine.
const TUTORIAL_EXAMPLES = [
  { id: "fresh", counts: PRESETS[0].counts, label: () => t("preset_fresh") },
  { id: "last", counts: SquidTutorial.LAST_SQUID, label: () => t("tut_example_last") },
  { id: "me4", counts: PRESETS[4].counts, label: () => t("preset_me4") },
  { id: "villain4", counts: PRESETS[5].counts, label: () => t("preset_villain4") },
];

/** Signed amount with its unit, e.g. "+100 chips" or "−1,000 chips". */
const signed_amount = (bb, unit = state.unit, digits = 1) => `${signed(bb, unit, digits)} ${unit_name(unit)}`;

/** Rows of horizontal bars around zero, to one scale; each row is {label, value (BB), chance?, summary?, long? (label on its own line)}. */
function value_bars(rows) {
  const scale = Math.max(...rows.map((row) => Math.abs(row.value)), 1e-9);
  const has_negative = rows.some((row) => row.value < -1e-9);
  const zero = has_negative && rows.some((row) => row.value > 1e-9) ? 50 : has_negative ? 100 : 0;
  const room = zero === 50 ? 50 : 100;
  return `<div class="vbars">${rows.map((row) => {
    const width = (room * Math.abs(row.value)) / scale;
    const left = row.value >= 0 ? zero : zero - width;
    const chance = row.chance === undefined ? "" : `<span class="vbar-chance">${percent(row.chance)}</span>`;
    const layout = row.long ? " long" : row.chance === undefined ? " no-chance" : "";
    return `<div class="vbar-row${layout}${row.summary ? " summary" : ""}">`
      + `<span class="vbar-label">${row.label}</span>${chance}`
      + `<span class="vbar-track"><span class="vbar-zero" style="left:${zero}%"></span><span class="vbar-fill ${row.value >= 0 ? "positive" : "negative"}" style="left:${left}%;width:${width}%"></span></span>`
      + `<span class="cell-stack"><span class="vbar-value">${signed(row.value)}</span><span class="secondary">${signed_amount(row.value, other_unit())}</span></span></div>`;
  }).join("")}</div>`;
}

/** A small table: header cells, body rows of cells, and an optional class per row. */
function small_table(header, rows) {
  return `<table class="tut-table"><thead><tr>${header.map((cell) => `<th scope="col">${cell}</th>`).join("")}</tr></thead>`
    + `<tbody>${rows.map((row) => `<tr class="${row.class || ""}">${row.cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

const step_heading = (step, text) => `<span class="tut-step">${step}</span><span>${text}</span>`;

function render_tutorial(engine) {
  const button = button_for_my_position();
  const fresh = SquidTutorial.fresh_round(engine, button);
  const last = SquidTutorial.last_squid(engine, button, SquidEngine.settle_round);
  const jackpot = SquidTutorial.jackpot(engine, button);
  const problem = state_problem(state.counts);
  const current = problem ? null : SquidTutorial.one_step(engine, state.counts, state.button, state.me);
  render_tutorial_examples();
  render_one_step(current, problem);
  render_fresh_section(fresh);
  render_last_squid_section(last);
  render_jackpot_section(jackpot, fresh);
  render_formula_sheet(engine, current, fresh, last);
  render_table_rules(fresh, last, jackpot);
}

function render_tutorial_examples() {
  const pressed = TUTORIAL_EXAMPLES.find((example) => counts_from_me(example.counts, state.me).every((count, seat) => count === state.counts[seat]));
  $("tut-examples").innerHTML = TUTORIAL_EXAMPLES.map((example) => `<button type="button" class="preset" id="tut-example-${example.id}" data-example="${example.id}" aria-pressed="${pressed === example}">${example.label()}</button>`).join("");
}

function render_one_step(step, problem) {
  $("tut1-state").textContent = problem ? t("tut_invalid") : t("tut1_state", { position: position_of(state.me), squids: squids_text(state.counts[state.me]) });
  if (!step) {
    $("tut1-body").innerHTML = "";
    return;
  }
  const rows = clockwise_from(state.me).map((seat) => ({
    label: seat === state.me ? `<b>${t("tut1_me_wins")}</b>` : position_of(seat),
    chance: step.outcomes[seat].chance,
    value: step.outcomes[seat].value,
  }));
  if (step.chop.chance > 0) rows.push({ label: t("tut1_chop"), chance: step.chop.chance, value: step.chop.value });
  const header = `<div class="vbar-row tut-head muted"><span>${t("tut1_col_outcome")}</span><span class="vbar-chance">${t("tut1_col_chance")}</span><span></span><span>${t("tut1_col_value")}</span></div>`;
  const summary = value_bars([
    { label: t("tut1_v_win"), value: step.value_if_i_win, summary: true },
    { label: t("tut1_v_opponents"), value: step.value_if_opponent_wins },
    { label: t("tut1_ante"), value: step.ante, summary: true },
  ]);
  $("tut1-body").innerHTML = `${header}${value_bars(rows)}<p class="tut-check">${t("tut1_check", { value: amount(step.weighted_sum, state.unit, 2) })}</p>${summary}`;
}

function render_fresh_section(fresh) {
  $("tut2-title").innerHTML = step_heading(2, t("tut2_title", { ante: amount(fresh.ante) }));
  const symmetric = state.model === "uniform";
  $("tut2-check").textContent = t(symmetric ? "tut2_check" : "tut2_check_position", {
    ante: amount(fresh.ante, state.unit, 2), seven_eighths: amount(fresh.seven_eighths, state.unit, 2), value_if_i_win: amount(fresh.value_if_i_win, state.unit, 2),
  });
  const part_names = ["collected", "paid", "jackpot"];
  const labels = { collected: t("tut2_part_collected"), paid: t("tut2_part_paid"), jackpot: t("tut2_part_jackpot") };
  const total = (parts) => sum(part_names.map((name) => parts[name]));
  const row = (label, win, opponent, extra_class) => ({
    class: extra_class,
    cells: [label, signed(win), signed(opponent), `<span class="${extra_class ? "" : "highlight"}">${signed(win - opponent)}</span>`],
  });
  const rows = part_names.map((name) => row(labels[name], fresh.parts_win[name], fresh.parts_opponent[name]));
  rows.push(row(t("tut2_part_total"), total(fresh.parts_win), total(fresh.parts_opponent), "total"));
  const header = ["", `${t("tut2_col_win")} (${unit_name()})`, t("tut2_col_opponent"), t("tut2_col_difference")];
  const difference_bars = value_bars(part_names.map((name) => ({ label: labels[name], value: fresh.parts_win[name] - fresh.parts_opponent[name] })));
  $("tut2-parts").innerHTML = small_table(header, rows) + difference_bars;
  $("tut2-insurance").textContent = t("tut2_insurance", {
    p_now: percent(fresh.parts_now.p_pay), p_win: percent(fresh.parts_win.p_pay), p_opponent: percent(fresh.parts_opponent.p_pay), payers: fixed(fresh.expected_payers, 1),
    bill: amount(-fresh.parts_now.paid / fresh.parts_now.p_pay),
  });
}

function render_last_squid_section(last) {
  $("tut3-title").innerHTML = step_heading(3, t("tut3_title", { swing: amount(last.swing), penalty: amount(last.penalty_avoided) }));
  $("tut3-lead").textContent = t("tut3_lead", { counts: last.counts.join(", ") });
  const { me, other_zero, holder } = last.branches;
  $("tut3-branches").innerHTML = value_bars([
    { label: t("tut3_branch_me"), chance: me.chance, value: me.value, long: true },
    { label: t("tut3_branch_other"), chance: other_zero.chance, value: other_zero.value, long: true },
    { label: t("tut3_branch_holder"), chance: holder.chance, value: holder.value, long: true },
  ]);
  $("tut3-formula").textContent = t("tut3_formula", { avoided: amount(last.penalty_avoided), collected: amount(last.collected), swing: amount(last.swing) });
  const top = Math.max(...last.table.map((entry) => entry.ante));
  const rows = last.table.map((entry) => ({
    class: entry.squids_out === sum(last.counts) ? "total" : "",
    cells: [String(entry.squids_out), amount(entry.loser_bill), `${amount(entry.ante)} <span class="vbar-track" style="display:inline-block;width:5em;vertical-align:middle"><span class="vbar-fill positive" style="left:0;width:${(100 * entry.ante) / top}%"></span></span>`],
  }));
  $("tut3-table").innerHTML = small_table([t("tut3_col_out"), t("tut3_col_bill"), t("tut3_col_ante")], rows);
}

function render_jackpot_section(jackpot, fresh) {
  const four = jackpot.on_four;
  const villain = jackpot.villain_on_four;
  $("tut4-lead").textContent = t("tut4_lead", {
    value_if_i_win: amount(four.value_if_i_win), p_later: percent(four.chance_of_jackpot_later), value_if_opponent_wins: amount(four.value_if_opponent_wins), ante: amount(four.ante),
  });
  $("tut4-bars").innerHTML = value_bars([
    { label: t("tut4_bar_win"), value: four.value_if_i_win },
    { label: t("tut4_bar_opponent"), value: four.value_if_opponent_wins },
    { label: t("tut4_bar_ante"), value: four.ante, summary: true },
  ]);
  $("tut4-villain").textContent = t("tut4_villain_lead", { ante: amount(villain.ante), ante_fresh: amount(fresh.ante), denial: amount(villain.denial) });
  $("tut4-villain-bars").innerHTML = value_bars([
    { label: t("tut4_bar_win"), value: villain.value_if_i_win },
    { label: t("tut4_bar_opponent"), value: villain.value_if_opponent_wins },
    { label: t("tut4_bar_villain"), value: villain.value_if_villain_wins },
  ]);
}

function render_formula_sheet(engine, current, fresh, last) {
  const dash = "–";
  const read = current ? read_state(engine) : null;
  const villain_row = read && read.swings.find((entry) => entry.seat === state.villain);
  const odds = villain_row && state.call > 0 ? SquidTutorial.pot_odds(state.pot, state.call, villain_row.swing) : null;
  const standup = SquidTutorial.standup_swing();
  const entries = [
    ["tut5_recursion", { value: current ? amount(current.value_now, state.unit, 2) : dash }],
    ["tut5_ante", { ante: current ? amount(current.ante, state.unit, 2) : dash }],
    ["tut5_fresh", { ante: amount(fresh.ante, state.unit, 2), value_if_i_win: amount(fresh.seven_eighths, state.unit, 2) }],
    ["tut5_last", { avoided: amount(last.penalty_avoided), collected: amount(last.collected), swing: amount(last.swing) }],
    ["tut5_odds", odds
      ? { call: amount(state.call), pot: amount(state.pot), swing: amount(villain_row.swing), needed: percent(odds.with_squid), plain: percent(odds.plain) }
      : { call: dash, pot: dash, swing: dash, needed: dash, plain: dash }],
    ["tut5_dead", { multiple: fixed(fresh.multiple), stack: amount(fresh.stack, "bb", 0) }],
    ["tut5_standup", { fresh: amount(standup.fresh), late: amount(standup.late) }],
  ];
  $("tut5-sheet").innerHTML = entries.map(([key, values]) => {
    const example_key = key === "tut5_recursion" ? "tut5_recursion_example" : `${key}_example`;
    return `<dt>${t(`${key}_name`)}</dt><dd class="formula">${t(key)}</dd><dd class="example">${t(example_key, values)}</dd>`;
  }).join("");
}

function render_table_rules(fresh, last, jackpot) {
  const defence = SquidTutorial.big_blind_defence(fresh.ante);
  const four = jackpot.on_four;
  const rules = [
    t("tut6_insurance", { ante: amount(fresh.ante), blinds_multiple: Math.round(fresh.blinds_multiple), p_now: percent(fresh.parts_now.p_pay), p_win: percent(fresh.parts_win.p_pay) }),
    t("tut6_last", { swing: amount(last.swing), avoided: amount(last.penalty_avoided), collected: amount(last.collected) }),
    t("tut6_villain", { ante: amount(jackpot.villain_on_four.ante), denial: amount(jackpot.villain_on_four.denial) }),
    t("tut6_bb", { open: amount(defence.open), call: amount(defence.call), pot: amount(defence.pot), plain: percent(defence.plain), squid: percent(defence.with_squid) }),
    t("tut6_four", { ante: amount(four.ante), multiple: fixed(four.multiple), stack: amount(four.stack, "bb", 0) }),
  ];
  $("tut6-rules").innerHTML = rules.map((rule) => `<li>${rule}</li>`).join("");
}

// One full redraw: cheap, because every number is a lookup into the solved engine.
function update() {
  const engine = current_engine();
  const problem = state_problem(state.counts);
  const read = problem ? null : read_state(engine);
  render_table();
  render_real_money(engine);
  render_answer(read, problem);
  render_villain_options(read);
  render_odds(read);
  render_strip(read);
  render_key_states(engine);
  render_heatmap(engine);
  render_endings(engine, read);
  render_sensitivity();
  if (current_view === "how") render_tutorial(engine);
  const model = t(state.model === "uniform" ? "model_uniform" : "model_position");
  $("footer").textContent = t("footer", { model, chop: state.chop, ms: Math.round(engine.solve_ms) });
  save_state();
}

/** Redraw only the pot-odds panel after its inputs change. */
function update_odds() {
  render_odds(state_problem(state.counts) ? null : read_state(current_engine()));
  save_state();
}

let chop_timer;
function wire_controls() {
  for (const input of document.querySelectorAll('input[name="tap-mode"]')) {
    input.addEventListener("change", () => set_mode(input.value));
  }
  for (const input of document.querySelectorAll('input[name="win-model"]')) {
    input.addEventListener("change", () => { state.model = input.value; update(); });
  }
  for (const input of document.querySelectorAll('input[name="unit"]')) {
    input.addEventListener("change", () => { state.unit = input.value; render_odds_inputs(); update(); });
  }
  for (const input of document.querySelectorAll('input[name="language"]')) {
    input.addEventListener("change", () => { state.language = input.value; apply_language(); render_odds_inputs(); update(); });
  }
  $("chop-rate").addEventListener("input", (event) => {
    state.chop = Number(event.target.value);
    $("chop-value").textContent = `${state.chop}%`;
    clearTimeout(chop_timer);
    chop_timer = setTimeout(update, 150);
  });
  for (const id of ["pot-size", "call-amount"]) {
    $(id).addEventListener("input", () => { read_odds_inputs(); update_odds(); });
  }
  $("villain-seat").addEventListener("change", (event) => { state.villain = Number(event.target.value); update_odds(); });
  $("odds-form").addEventListener("submit", (event) => event.preventDefault());
  for (const view of VIEWS) $(`tab-${view}`).addEventListener("click", () => { location.hash = view; });
  $("tab-calc").addEventListener("keydown", (event) => { if (event.key === "ArrowRight") { location.hash = "how"; $("tab-how").focus(); } });
  $("tab-how").addEventListener("keydown", (event) => { if (event.key === "ArrowLeft") { location.hash = "calc"; $("tab-calc").focus(); } });
  window.addEventListener("hashchange", () => show_view(view_from_hash()));
  $("tut-examples").addEventListener("click", (event) => {
    const chip = event.target.closest("[data-example]");
    if (!chip) return;
    state.counts = counts_from_me(TUTORIAL_EXAMPLES.find((example) => example.id === chip.dataset.example).counts, state.me);
    state.villain = null;
    update();
  });
  $("key-bars").addEventListener("click", (event) => {
    const bar = event.target.closest("[data-preset]");
    if (bar) load_preset(PRESETS.find((preset) => preset.id === bar.dataset.preset));
  });
}

function start() {
  load_state();
  $(state.model === "uniform" ? "model-uniform" : "model-position").checked = true;
  $(`unit-${state.unit}`).checked = true;
  $(`lang-${state.language}`).checked = true;
  $("chop-rate").value = String(state.chop);
  $("chop-value").textContent = `${state.chop}%`;
  build_table();
  build_presets();
  wire_controls();
  apply_language();
  render_odds_inputs();
  update();
  show_view(view_from_hash());
}

start();

</script>
</body>
</html>
