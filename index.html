<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squid Value Lab</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap");

/* Layout: a card-room instrument; felt table builder beside the read-out for "me", context charts below. */
:root {
  --bg: #edf0ed;
  --surface: #fbfcfb;
  --surface-2: #e3e8e4;
  --ink: #15201a;
  --ink-2: #45534a;
  --ink-3: #6b7a71;
  --line: #cfd8d2;
  --felt: #2f7356;
  --felt-2: #215a42;
  --rail: #4a3527;
  --felt-ink: #eaf4ee;
  --chip-face: #f7f5ef;
  --chip-ink: #1d2420;
  --accent: #2a6bc4;
  --accent-soft: #dce7f7;
  --on-accent: #ffffff;
  --series-2: #c48a0e;
  --danger: #b8352b;
  --danger-soft: #f7e0dd;
  --caution: #a8551b;
  --caution-soft: #f6e6d6;
  --seq-low: #e7eef8;
  --seq-high: #1c4f99;
  --focus: #2a6bc4;
  --shadow: #15201a26;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-body: "Public Sans", "Segoe UI", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713;
    --surface: #17201b;
    --surface-2: #202b25;
    --ink: #e5ece7;
    --ink-2: #a9b7ae;
    --ink-3: #7f8e85;
    --line: #2d3a32;
    --felt: #24573f;
    --felt-2: #183f2d;
    --rail: #3a2a1f;
    --felt-ink: #dcebe2;
    --chip-face: #ece9e0;
    --chip-ink: #1d2420;
    --accent: #4f8ce0;
    --accent-soft: #1d2e47;
    --on-accent: #0c1420;
    --series-2: #b8860b;
    --danger: #ef7a6d;
    --danger-soft: #45221e;
    --caution: #e8955c;
    --caution-soft: #3d2b1b;
    --seq-low: #1b2633;
    --seq-high: #7fb0f0;
    --focus: #7fb0f0;
    --shadow: #00000066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101713;
  --surface: #17201b;
  --surface-2: #202b25;
  --ink: #e5ece7;
  --ink-2: #a9b7ae;
  --ink-3: #7f8e85;
  --line: #2d3a32;
  --felt: #24573f;
  --felt-2: #183f2d;
  --rail: #3a2a1f;
  --felt-ink: #dcebe2;
  --chip-face: #ece9e0;
  --chip-ink: #1d2420;
  --accent: #4f8ce0;
  --accent-soft: #1d2e47;
  --on-accent: #0c1420;
  --series-2: #b8860b;
  --danger: #ef7a6d;
  --danger-soft: #45221e;
  --caution: #e8955c;
  --caution-soft: #3d2b1b;
  --seq-low: #1b2633;
  --seq-high: #7fb0f0;
  --focus: #7fb0f0;
  --shadow: #00000066;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
.page { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
@media (min-width: 720px) { .page { padding-inline: 28px; } }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
p { margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Header and settings */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 28px; }
.title-block { display: grid; gap: 2px; min-width: 0; }
.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.setting { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.setting-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.chop-control { display: flex; align-items: center; gap: 8px; }
.chop-control input { width: 120px; accent-color: var(--accent); }
.chop-value { min-width: 3.5em; font-family: var(--font-display); font-weight: 600; }

/* Segmented radio controls */
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 2px; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.segmented label { padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.segmented input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.segmented input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }

/* Panels */
.workbench { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "table" "answer" "odds"; }
@media (min-width: 900px) {
  .workbench { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-areas: "table answer" "odds answer"; align-items: start; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.area-table { grid-area: table; }
.area-answer { grid-area: answer; }
.area-odds { grid-area: odds; }

/* The felt table */
.table-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1.3; }
@media (min-width: 520px) { .table-wrap { aspect-ratio: 1.55; } }
.felt {
  position: absolute; inset: 17% 15%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 38%, var(--felt), var(--felt-2));
  box-shadow: 0 0 0 7px var(--rail), 0 0 0 8px var(--line);
  display: grid; place-content: center; text-align: center; color: var(--felt-ink); padding: 8px;
}
.felt-line { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.felt-sub { font-size: 12px; opacity: 0.85; }
.felt-flag { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chip-face); background: var(--danger); border-radius: 4px; padding: 1px 8px; justify-self: center; margin-top: 4px; }
.seat {
  position: absolute; transform: translate(-50%, -50%);
  width: clamp(56px, 15%, 78px); aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  display: grid; place-content: center; justify-items: center; gap: 1px; cursor: pointer; padding: 0;
  box-shadow: 0 1px 2px var(--shadow);
  transition: border-color 0.15s, background-color 0.15s;
}
.seat:hover { border-color: var(--ink-3); }
.seat-pos { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-2); line-height: 1; }
.seat-count { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1; }
.pips { display: flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink-3); background: transparent; }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.seat.is-me { border: 3px solid var(--accent); background: var(--accent-soft); }
.seat.at-three { border-color: var(--caution); background: var(--caution-soft); }
.seat.at-four { border-color: var(--danger); background: var(--danger-soft); }
.seat.at-four .seat-count { color: var(--danger); }
.seat.at-four .pips i.on { background: var(--danger); border-color: var(--danger); }
.seat.is-me.at-three, .seat.is-me.at-four { border-width: 3px; border-color: var(--accent); }
.seat-tag {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  background: var(--accent); color: var(--on-accent); border-radius: 3px; padding: 0 5px; line-height: 15px;
}
.dealer {
  position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%;
  background: var(--chip-face); color: var(--chip-ink); border: 2px solid var(--rail);
  font: 700 11px/18px var(--font-display); text-align: center; pointer-events: none;
  transition: left 0.2s, top 0.2s;
}
.builder-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px;
  font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink);
}
.preset:hover { border-color: var(--ink-3); }
.preset[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Answer for me */
.who { font-size: 13px; color: var(--ink-2); }
.flag {
  border: 1px solid var(--danger); background: var(--danger-soft); color: var(--ink);
  border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px;
}
.flag strong { color: var(--danger); font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; font-size: 14px; }
.hero { display: grid; gap: 4px; }
.hero-number { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hero-value { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.01em; }
.hero-unit { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--ink-2); }
.hero-caption { color: var(--ink-2); font-size: 14px; max-width: 46ch; }
.alert-pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px;
  font-size: 13px; font-weight: 600; background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger);
  justify-self: start;
}
.alert-pill.caution { background: var(--caution-soft); color: var(--caution); border-color: var(--caution); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) and (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.stat dt { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.stat dd { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.rule-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; justify-self: start; }
.swing-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.swing-row { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 4.8em 4.4em; align-items: center; gap: 8px; font-size: 13px; }
.swing-who { display: grid; line-height: 1.2; min-width: 0; }
.swing-who b { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.swing-who span { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.swing-row.at-four .swing-who b { color: var(--danger); }
.swing-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.swing-base, .swing-extra { position: absolute; top: 0; bottom: 0; }
.swing-base { left: 0; background: var(--ink-3); opacity: 0.45; border-radius: 3px 0 0 3px; }
.swing-extra { background: var(--danger); border-radius: 0 3px 3px 0; }
.swing-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.swing-value { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-align: right; }
.swing-denial { color: var(--ink-3); font-size: 12px; }
.swing-denial.positive { color: var(--danger); font-weight: 600; }
.swing-head { display: grid; grid-template-columns: 7.2em minmax(0, 1fr) 4.8em 4.4em; gap: 8px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.swing-head span:nth-child(n+3) { text-align: right; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.swatch.base { background: var(--ink-3); opacity: 0.45; }
.swatch.extra { background: var(--danger); }
.swatch.tick { width: 2px; height: 12px; background: var(--ink); }
.swatch.s1 { background: var(--accent); }
.swatch.s2 { background: var(--series-2); }

/* Pot odds */
.odds-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.odds-inputs .wide { grid-column: 1 / -1; }
@media (min-width: 560px) { .odds-inputs { grid-template-columns: 1fr 1fr 1.4fr; } .odds-inputs .wide { grid-column: auto; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; min-height: 38px;
}
.odds-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.odds-result { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.odds-result.with-squid { border-color: var(--accent); background: var(--accent-soft); }
.odds-result span { font-size: 12px; color: var(--ink-3); }
.odds-result b { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.05; }
.odds-scale { position: relative; height: 26px; }
.odds-rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--surface-2); border-radius: 2px; }
.odds-mark { position: absolute; top: 4px; width: 3px; height: 18px; transform: translateX(-50%); border-radius: 2px; }
.odds-mark.plain { background: var(--ink-3); }
.odds-mark.squid { background: var(--accent); }
.odds-span { position: absolute; top: 11px; height: 4px; background: var(--accent); opacity: 0.35; }
.odds-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
.small-print { font-size: 12px; color: var(--ink-3); max-width: 70ch; }

/* Every seat strip */
.seat-strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 520px) { .seat-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.strip-cell { border-radius: 6px; padding: 8px 4px; text-align: center; display: grid; gap: 1px; border: 2px solid transparent; }
.strip-cell.is-me { border-color: var(--accent); }
.strip-pos { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.strip-value { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.strip-meta { font-size: 11px; opacity: 0.85; }

/* Charts */
.charts { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chart-note { font-size: 12px; color: var(--ink-3); }
.hbars { display: grid; gap: 5px; }
.hbar { display: grid; grid-template-columns: 10.5em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 13px; text-align: left; background: none; border: 0; padding: 2px 0; border-radius: 4px; cursor: pointer; color: var(--ink); }
.hbar:hover .hbar-fill { filter: brightness(1.08); }
.hbar-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hbar-track { height: 14px; position: relative; }
.hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 3px 3px 0; }
.hbar.current .hbar-label { color: var(--ink); font-weight: 700; }
.hbar:not(.current) .hbar-fill { opacity: 0.55; }
.hbar-value { font-family: var(--font-display); font-weight: 600; text-align: right; font-size: 15px; }
.grid-lines { position: relative; height: 16px; margin-left: calc(10.5em + 8px); margin-right: calc(3.4em + 8px); font-size: 13px; color: var(--ink-3); }
.grid-lines span { position: absolute; transform: translateX(-50%); font-size: 11px; }
.heat-wrap { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 300px; }
.heat th { font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 2px 4px; }
.heat td { text-align: center; border-radius: 5px; padding: 9px 2px; font-family: var(--font-display); font-weight: 600; font-size: 16px; border: 2px solid transparent; }
.heat td.now { border-color: var(--ink); }
.heat caption { caption-side: bottom; text-align: left; font-size: 12px; color: var(--ink-3); padding-top: 6px; }
.columns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 170px; border-bottom: 1px solid var(--line); }
.column-group { display: flex; align-items: end; justify-content: center; gap: 3px; height: 100%; }
.column { width: min(22px, 42%); position: relative; border-radius: 3px 3px 0 0; }
.column.s1 { background: var(--accent); }
.column.s2 { background: var(--series-2); }
.column-value { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; padding-bottom: 2px; font-family: var(--font-display); font-weight: 600; }
.column-labels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: var(--ink-2); text-align: center; }
.pair-bars { display: grid; gap: 7px; }
.pair-row { display: grid; grid-template-columns: 10.5em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.pair-row > span:first-child { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-stack { display: grid; gap: 2px; }
.pair-line { display: flex; align-items: center; gap: 6px; height: 11px; }
.pair-fill { height: 100%; border-radius: 0 3px 3px 0; min-width: 2px; }
.pair-fill.s1 { background: var(--accent); }
.pair-fill.s2 { background: var(--series-2); }
.pair-value { font-size: 11px; color: var(--ink-2); font-family: var(--font-display); font-weight: 600; }

/* Method note */
details.method { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.method summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
details.method ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; max-width: 72ch; color: var(--ink-2); font-size: 14px; }
.footer { font-size: 12px; color: var(--ink-3); }
.secondary { font-size: 12px; color: var(--ink-3); font-family: var(--font-body); font-weight: 500; white-space: nowrap; }
.hero-secondary { font-size: 15px; }
.real-line { font-size: 14px; color: var(--ink-2); max-width: 92ch; border-left: 3px solid var(--felt); padding-left: 10px; }
.real-line b { color: var(--ink); font-weight: 600; }
.cell-stack { display: grid; justify-items: end; line-height: 1.15; }
.cell-stack .secondary { font-size: 10.5px; }

/* Chinese: CJK has no capitals, so drop the tracking used for English uppercase labels */
:lang(zh-CN) .setting-label, :lang(zh-CN) h3, :lang(zh-CN) .rule-tag, :lang(zh-CN) .swing-head, :lang(zh-CN) .flag strong, :lang(zh-CN) .felt-flag { letter-spacing: 0; }
:lang(zh-CN) .hero-caption, :lang(zh-CN) .small-print, :lang(zh-CN) .chart-note { line-height: 1.65; }

@media (max-width: 420px) {
  .hero-value { font-size: 48px; }
  .swing-row, .swing-head { grid-template-columns: 6em minmax(0, 1fr) 4.4em 4.1em; gap: 6px; }
  .hbar { grid-template-columns: 8.2em minmax(0, 1fr) 3.4em; }
  .pair-row { grid-template-columns: 8.2em minmax(0, 1fr); }
  .heat td { font-size: 14px; padding-inline: 1px; }
  .grid-lines { margin-left: calc(8.2em + 8px); margin-right: calc(3.4em + 8px); }
}

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; margin-bottom: -1px; cursor: pointer; font: 600 17px/1.2 var(--font-display); color: var(--ink-3); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--felt); }
.view { display: grid; gap: 20px; min-width: 0; }

/* Tutorial */
.tutorial { max-width: 860px; }
.tut-intro { font-size: 16px; color: var(--ink-2); max-width: 70ch; }
.tut p { max-width: 72ch; }
.tut h2 { display: flex; align-items: baseline; gap: 10px; }
.tut-step { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--felt-ink); background: var(--felt); border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-content: center; flex: none; }
.formula { font-family: var(--font-display); font-size: 17px; line-height: 1.5; background: var(--surface-2); border-radius: 6px; padding: 8px 12px; overflow-x: auto; max-width: 100%; }
.formula i { font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; font-style: italic; }
.tut-check { color: var(--ink-2); font-size: 14px; }
.tut-more summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.tut-more[open] { display: grid; gap: 10px; }
.table-scroll { overflow-x: auto; max-width: 100%; }
.tut-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tut-table th, .tut-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tut-table th:first-child, .tut-table td:first-child { text-align: left; white-space: normal; min-width: 8.5em; }
.tut-table thead th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.tut-table tr.total td { font-weight: 700; border-bottom: 0; }
.tut-table td.highlight { color: var(--accent); font-weight: 700; }
.vbars { display: grid; gap: 6px; }
.vbar-row { display: grid; grid-template-columns: minmax(0, 9em) 3.6em minmax(0, 1fr) 6.4em; gap: 8px; align-items: center; font-size: 13px; }
.vbar-row.no-chance { grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 6.4em; }
.vbar-row.long { grid-template-columns: 3.6em minmax(0, 1fr) 6.4em; }
.vbar-row.long .vbar-label { grid-column: 1 / -1; color: var(--ink); }
.vbar-row.summary { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.vbar-label { min-width: 0; color: var(--ink-2); }
.vbar-row.summary .vbar-label { color: var(--ink); }
.vbar-chance { text-align: right; color: var(--ink-3); font-family: var(--font-display); }
.vbar-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; }
.vbar-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.vbar-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.vbar-fill.positive { background: var(--accent); }
.vbar-fill.negative { background: var(--series-2); }
.vbar-value { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.formula-sheet { display: grid; gap: 4px; margin: 0; }

<script>
// Layer 1 squid value engine: a direct JavaScript port of value_engine/markov_value.py (rules from rules/squid_rules.py).
(function (root) {
  "use strict";

  const NUM_PLAYERS = 8;
  const TOTAL_SQUIDS = 10;
  const PAY_PER_SQUID = 100;
  const JACKPOT_THRESHOLD = 5;
  const JACKPOT_PER_PLAYER = 1000;
  const CHIPS_PER_BB = 50;

  // position name for each seat offset from the button (offset 0 = the button itself), 8-handed only
  const POSITION_BY_OFFSET_FROM_BUTTON = ["BTN", "SB", "BB", "UTG", "UTG+1", "MP", "HJ", "CO"];

  // ILLUSTRATIVE GUESS at non-chopped-pot win share by position (sums to 1.0), not measured data
  const ILLUSTRATIVE_WIN_SHARE_BY_POSITION = {
    UTG: 0.10, "UTG+1": 0.10, MP: 0.11, HJ: 0.12, CO: 0.13, BTN: 0.16, SB: 0.10, BB: 0.18,
  };

  const ENDING_NAMES = ["jackpot", "1 loser", "2 losers", "3 losers", "4 losers", "5 losers", "6 losers", "7 losers"];

  // main payload per (counts, button): 8 seat values (chips), 8 ending probabilities, 1 expected hands left
  const VALUE = 0;
  const ENDING = 8;
  const HANDS = 16;
  const MAIN_PAYLOAD = 17;

  // one hero's final settlement split by source: collected as a holder, paid as a 0-squid loser, jackpot (chips), then P(hero pays), P(hero wins the jackpot)
  const PART_NAMES = ["collected", "paid", "jackpot", "p_pay", "p_my_jackpot"];

  // squid counts are encoded as a base-6 number so a child state's key is the parent's key plus 6^winner
  const POWERS_OF_SIX = Array.from({ length: NUM_PLAYERS }, (_, seat) => 6 ** seat);

  const sum = (numbers) => numbers.reduce((total, number) => total + number, 0);
  const players_without_squid = (counts) => counts.filter((count) => count === 0).length;
  const key_of = (counts) => sum(counts.map((count, seat) => count * POWERS_OF_SIX[seat]));

  /** The 8-handed position name of a seat, given where the button sits. */
  function position_name(seat, button_seat) {
    return POSITION_BY_OFFSET_FROM_BUTTON[(seat - button_seat + NUM_PLAYERS) % NUM_PLAYERS];
  }

  /** Win probability per seat for the next hand; they sum to 1 - chop. */
  function win_probabilities(model, chop, button_seat) {
    return Array.from({ length: NUM_PLAYERS }, (_, seat) =>
      model === "uniform"
        ? (1 - chop) / NUM_PLAYERS
        : ILLUSTRATIVE_WIN_SHARE_BY_POSITION[position_name(seat, button_seat)] * (1 - chop));
  }

  /** Throws for a squid-count vector the real game can never reach (Python's _validate_squid_counts). */
  function validate_squid_counts(counts) {
    if (counts.length !== NUM_PLAYERS) throw new Error(`expected ${NUM_PLAYERS} seats, got ${counts.length}`);
    if (!counts.every((count) => Number.isInteger(count) && count >= 0)) throw new Error(`squid counts must be whole numbers >= 0: ${counts}`);
    if (sum(counts) > TOTAL_SQUIDS) throw new Error(`squid counts sum to ${sum(counts)}, more than ${TOTAL_SQUIDS}`);
    if (players_without_squid(counts) === 0) throw new Error(`every player holds a squid, which can never happen: ${counts}`);
    if (counts.filter((count) => count >= JACKPOT_THRESHOLD).length >= 2) throw new Error(`two players at or above the jackpot: ${counts}`);
    if (counts.some((count) => count > JACKPOT_THRESHOLD)) throw new Error(`a player is above the jackpot threshold: ${counts}`);
  }

  /** Every zero-squid player pays every holder 100 x that holder's squids. */
  function settlement_payoffs(counts) {
    const losers = players_without_squid(counts);
    const squids_out = sum(counts);
    return counts.map((count) => (count > 0 ? PAY_PER_SQUID * count * losers : -PAY_PER_SQUID * squids_out));
  }

  /** The payoff vector if the round has ended at this state, else null (brief 1.3, checked in order). */
  function settle_round(counts) {
    const jackpot_winner = counts.findIndex((count) => count >= JACKPOT_THRESHOLD);
    if (jackpot_winner >= 0) {
      // corrected rule (John, 2026-10-03): only the zero-squid players pay the jackpot; holders pay nothing
      const zero_squid_players = players_without_squid(counts);
      return counts.map((count, seat) => {
        if (seat === jackpot_winner) return JACKPOT_PER_PLAYER * zero_squid_players;
        return count === 0 ? -JACKPOT_PER_PLAYER : 0;
      });
    }
    if (players_without_squid(counts) === 1 || sum(counts) === TOTAL_SQUIDS) return settlement_payoffs(counts);
    return null;
  }

  /** Index into ENDING_NAMES for a state where the round just ended. */
  function ending_index(counts) {
    return counts.some((count) => count >= JACKPOT_THRESHOLD) ? 0 : players_without_squid(counts);
  }

  /** New squid counts after one hand; a null winner is a chop, which changes nothing. */
  function award_squid(counts, pot_winner) {
    return counts.map((count, seat) => (seat === pot_winner ? count + 1 : count));
  }

  /** Solve V[b] = self_loop[b] * V[b+1] + known[b] around the button cycle, exactly, for payloads of the given size. */
  function solve_button_cycle(self_loop, known, size) {
    const values = new Float64Array(known.length);
    // unroll from button 0: V[0] = sum_k (q_0...q_{k-1}) K[k] + (q_0...q_7) V[0]
    let loop_weight = 1;
    for (let button = 0; button < NUM_PLAYERS; button++) {
      for (let d = 0; d < size; d++) values[d] += loop_weight * known[button * size + d];
      loop_weight *= self_loop[button];
    }
    for (let d = 0; d < size; d++) values[d] /= 1 - loop_weight;
    for (let button = NUM_PLAYERS - 1; button >= 1; button--) {
      const next = ((button + 1) % NUM_PLAYERS) * size;
      for (let d = 0; d < size; d++) values[button * size + d] = self_loop[button] * values[next + d] + known[button * size + d];
    }
    return values;
  }

  /** The one recursion behind every public method, for any payload: returns payload_at(counts, button) plus a solved-state count. */
  function create_solver(win_by_button, chop, size, ended_payload, hand_index) {
    const solved = new Map();
    const terminal_cache = new Map();

    /** The ended_payload of a state where the round is over (cached), else null. */
    function terminal_payload(counts, key) {
      if (terminal_cache.has(key)) return terminal_cache.get(key);
      const payload = settle_round(counts) ? ended_payload(counts) : null;
      terminal_cache.set(key, payload);
      return payload;
    }

    /** 8 rows of size numbers, row b for button b. */
    function solve(counts, key) {
      const cached = solved.get(key);
      if (cached) return cached;
      const known = new Float64Array(NUM_PLAYERS * size);
      // our game has no per-player cap, so only a chop leaves the counts unchanged
      const self_loop = new Float64Array(NUM_PLAYERS).fill(chop);
      for (let button = 0; button < NUM_PLAYERS; button++) {
        const row = button * size;
        const next_row = ((button + 1) % NUM_PLAYERS) * size;
        if (hand_index >= 0) known[row + hand_index] += 1;
        for (let winner = 0; winner < NUM_PLAYERS; winner++) {
          const probability = win_by_button[button][winner];
          if (probability === 0) continue;
          counts[winner] += 1;
          const child_key = key + POWERS_OF_SIX[winner];
          const terminal = terminal_payload(counts, child_key);
          const child = terminal || solve(counts, child_key);
          const offset = terminal ? 0 : next_row;
          for (let d = 0; d < size; d++) known[row + d] += probability * child[offset + d];
          counts[winner] -= 1;
        }
      }
      const result = solve_button_cycle(self_loop, known, size);
      solved.set(key, result);
      return result;
    }

    /** The payload for (counts, button): solved row, or the ended payload if the round is already over. */
    function payload_at(counts, button_seat) {
      validate_squid_counts(counts);
      const key = key_of(counts);
      const terminal = terminal_payload(counts, key);
      if (terminal) return terminal;
      const start = button_seat * size;
      return solve(counts.slice(), key).subarray(start, start + size);
    }

    return { payload_at, solved_count: () => solved.size };
  }

  /** Settlement plus one-hot ending (0 hands left) for a round that has ended. */
  function main_ended_payload(counts) {
    const payload = new Float64Array(MAIN_PAYLOAD);
    payload.set(settle_round(counts), VALUE);
    payload[ENDING + ending_index(counts)] = 1;
    return payload;
  }

  /** One hero's settlement split by source, for a round that has ended. */
  function parts_ended_payload(counts, hero) {
    const payload = new Float64Array(PART_NAMES.length);
    const jackpot_winner = counts.findIndex((count) => count >= JACKPOT_THRESHOLD);
    if (jackpot_winner >= 0) {
      payload[2] = settle_round(counts)[hero];
      payload[4] = jackpot_winner === hero ? 1 : 0;
    } else if (counts[hero] > 0) {
      payload[0] = settle_round(counts)[hero];
    } else {
      payload[1] = settle_round(counts)[hero];
      payload[3] = 1;
    }
    return payload;
  }

  /** An engine for one win model ("uniform" or "position_weighted") and chop rate, with its own cache. */
  function create_engine(model = "uniform", chop = 0) {
    if (!(chop >= 0 && chop < 1)) throw new Error(`chop must be in [0, 1), got ${chop}`);
    if (model !== "uniform" && model !== "position_weighted") throw new Error(`unknown win model ${model}`);
    const win_by_button = Array.from({ length: NUM_PLAYERS }, (_, button) => win_probabilities(model, chop, button));
    const main = create_solver(win_by_button, chop, MAIN_PAYLOAD, main_ended_payload, HANDS);
    const payload_at = main.payload_at;
    const parts_by_hero = new Map();

    /** V(counts, button): expected final settlement per seat, chips. */
    function expected_payoffs(counts, button_seat) {
      return Array.from(payload_at(counts, button_seat).subarray(VALUE, VALUE + NUM_PLAYERS));
    }

    /** V(award_squid(counts, pot_winner), button + 1), chips; a null pot_winner is a chop. */
    function value_after_hand(counts, button_seat, pot_winner) {
      const next_counts = pot_winner === null ? counts : award_squid(counts, pot_winner);
      return expected_payoffs(next_counts, (button_seat + 1) % NUM_PLAYERS);
    }

    /** Hero's average value, chips, if one of the other seats wins this pot. */
    function value_if_opponent_wins(counts, button_seat, hero) {
      const opponents = [...Array(NUM_PLAYERS).keys()].filter((seat) => seat !== hero);
      return sum(opponents.map((opponent) => value_after_hand(counts, button_seat, opponent)[hero])) / opponents.length;
    }

    /** BB: hero's value from winning this pot minus hero's average value from an opponent winning it. */
    function implicit_ante(counts, button_seat, hero) {
      const value_if_hero_wins = value_after_hand(counts, button_seat, hero)[hero];
      return (value_if_hero_wins - value_if_opponent_wins(counts, button_seat, hero)) / CHIPS_PER_BB;
    }

    /** BB hero loses if pot_winner specifically wins this pot, versus an average opponent winning it. */
    function denial_cost(counts, button_seat, hero, pot_winner) {
      const value_if_pot_winner_wins = value_after_hand(counts, button_seat, pot_winner)[hero];
      return (value_if_opponent_wins(counts, button_seat, hero) - value_if_pot_winner_wins) / CHIPS_PER_BB;
    }

    /** P(round ends each way) from this state onward, keyed by ENDING_NAMES. */
    function ending_probabilities(counts, button_seat) {
      const payload = payload_at(counts, button_seat);
      return Object.fromEntries(ENDING_NAMES.map((name, index) => [name, payload[ENDING + index]]));
    }

    /** Expected number of hands still to be played before this round ends. */
    function expected_hands_remaining(counts, button_seat) {
      return payload_at(counts, button_seat)[HANDS];
    }

    /** Hero's expected final settlement split by source (chips) plus P(hero pays) and P(hero wins the jackpot); the money parts sum to V. */
    function settlement_parts(counts, button_seat, hero) {
      if (!parts_by_hero.has(hero)) {
        parts_by_hero.set(hero, create_solver(win_by_button, chop, PART_NAMES.length, (ended) => parts_ended_payload(ended, hero), -1));
      }
      const payload = parts_by_hero.get(hero).payload_at(counts, button_seat);
      return Object.fromEntries(PART_NAMES.map((name, index) => [name, payload[index]]));
    }

    /** settlement_parts after one hand with this pot winner (null = a chop). */
    function parts_after_hand(counts, button_seat, pot_winner, hero) {
      const next_counts = pot_winner === null ? counts : award_squid(counts, pot_winner);
      return settlement_parts(next_counts, (button_seat + 1) % NUM_PLAYERS, hero);
    }

    /** Solve every reachable state at once (all are reachable from the fresh round). */
    function solve_all() {
      payload_at(Array(NUM_PLAYERS).fill(0), 0);
      return main.solved_count();
    }

    return {
      model, chop, win_probabilities: (button_seat) => win_by_button[button_seat].slice(), solve_all, expected_payoffs,
      value_after_hand, implicit_ante, denial_cost, ending_probabilities, expected_hands_remaining, settlement_parts, parts_after_hand,
    };
  }

  const api = {
    NUM_PLAYERS, TOTAL_SQUIDS, JACKPOT_THRESHOLD, CHIPS_PER_BB, ENDING_NAMES, PART_NAMES, ILLUSTRATIVE_WIN_SHARE_BY_POSITION,
    position_name, settle_round, validate_squid_counts, award_squid, create_engine,
  };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.SquidEngine = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>
// Every number the "How it works" tab prints, computed from a solved engine (money in BB, chances as 0-1).
(function (root) {
  "use strict";

  const NUM_PLAYERS = 8;
  const CHIPS_PER_BB = 50;
  const FRESH = [0, 0, 0, 0, 0, 0, 0, 0];
  // hero is seat 0 in every example; opponents sit clockwise from hero
  const HERO = 0;
  const LAST_SQUID = [0, 2, 2, 2, 1, 1, 1, 0];
  // two players on 0 with S = 6, 7, 8, 9 squids out, holders on 1-2 squids
  const TWO_ON_ZERO = [[0, 1, 1, 1, 1, 1, 1, 0], [0, 2, 1, 1, 1, 1, 1, 0], [0, 2, 2, 1, 1, 1, 1, 0], [0, 2, 2, 2, 1, 1, 1, 0]];
  const HERO_ON_FOUR = [4, 0, 0, 0, 0, 0, 0, 0];
  const VILLAIN_ON_FOUR = [0, 4, 0, 0, 0, 0, 0, 0];
  // big-blind defence example: a 2.5 BB open, SB 0.5 and BB 1 in, so BB calls 1.5 into 4
  const OPEN_BB = 2.5;
  const BB_DEFENCE = { pot: 4, call: 1.5 };
  const BLINDS_BB = 1.5;
  const STACK_BB = 600;
  const STANDUP_VAL_BB = 3;

  const sum = (numbers) => numbers.reduce((total, number) => total + number, 0);
  const mean = (numbers) => sum(numbers) / numbers.length;
  const opponents_of = (seat) => [...Array(NUM_PLAYERS).keys()].filter((other) => other !== seat);
  const in_bb = (chips) => chips / CHIPS_PER_BB;
  const dead_money_multiple = (ante) => (ante + BLINDS_BB) / BLINDS_BB;

  /** Money parts in BB, chances unchanged. */
  function parts_in_bb(parts) {
    return { collected: in_bb(parts.collected), paid: in_bb(parts.paid), jackpot: in_bb(parts.jackpot), p_pay: parts.p_pay, p_my_jackpot: parts.p_my_jackpot };
  }

  /** The average of several parts objects, field by field. */
  function mean_parts(list) {
    return Object.fromEntries(Object.keys(list[0]).map((name) => [name, mean(list.map((parts) => parts[name]))]));
  }

  /** The one-step tree: every next-hand outcome with its chance and hero's value after, then the ante subtraction. */
  function one_step(engine, counts, button, hero) {
    const chances = engine.win_probabilities(button);
    const outcomes = chances.map((chance, seat) => ({ seat, chance, value: in_bb(engine.value_after_hand(counts, button, seat)[hero]) }));
    const chop = { seat: null, chance: engine.chop, value: in_bb(engine.value_after_hand(counts, button, null)[hero]) };
    const value_if_i_win = outcomes[hero].value;
    const value_if_opponent_wins = mean(opponents_of(hero).map((seat) => outcomes[seat].value));
    return {
      outcomes, chop, value_if_i_win, value_if_opponent_wins,
      ante: value_if_i_win - value_if_opponent_wins,
      engine_ante: engine.implicit_ante(counts, button, hero),
      value_now: in_bb(engine.expected_payoffs(counts, button)[hero]),
      weighted_sum: sum(outcomes.map((row) => row.chance * row.value)) + chop.chance * chop.value,
    };
  }

  /** Fresh round: the 7/8 identity and where V(I win) comes from. */
  function fresh_round(engine, button) {
    const step = one_step(engine, FRESH, button, HERO);
    const parts_win = parts_in_bb(engine.parts_after_hand(FRESH, button, HERO, HERO));
    const parts_opponent = mean_parts(opponents_of(HERO).map((seat) => parts_in_bb(engine.parts_after_hand(FRESH, button, seat, HERO))));
    const parts_now = parts_in_bb(engine.settlement_parts(FRESH, button, HERO));
    const endings = engine.ending_probabilities(FRESH, button);
    const expected_payers = sum([1, 2, 3, 4, 5, 6, 7].map((losers) => losers * endings[losers === 1 ? "1 loser" : `${losers} losers`]));
    return {
      ante: step.ante,
      value_if_i_win: step.value_if_i_win,
      value_if_opponent_wins: step.value_if_opponent_wins,
      seven_eighths: (7 / 8) * step.ante,
      parts_win, parts_opponent, parts_now,
      expected_payers,
      multiple: dead_money_multiple(step.ante),
      stack: STACK_BB / dead_money_multiple(step.ante),
      blinds_multiple: step.ante / BLINDS_BB,
    };
  }

  /** 9 out, me and one other on 0: three branches, then the ante for S = 6..9 squids out. */
  function last_squid(engine, button, settle_round) {
    const step = one_step(engine, LAST_SQUID, button, HERO);
    const other_zero = LAST_SQUID.findIndex((count, seat) => count === 0 && seat !== HERO);
    const holders = opponents_of(HERO).filter((seat) => seat !== other_zero);
    const branches = {
      me: { chance: step.outcomes[HERO].chance, value: step.outcomes[HERO].value },
      other_zero: { chance: step.outcomes[other_zero].chance, value: step.outcomes[other_zero].value },
      holder: { chance: sum(holders.map((seat) => step.outcomes[seat].chance)), value: mean(holders.map((seat) => step.outcomes[seat].value)) },
    };
    const table = TWO_ON_ZERO.map((counts) => {
      const after_i_win = counts.map((count, seat) => (seat === HERO ? count + 1 : count));
      return {
        squids_out: sum(counts),
        counts,
        loser_bill: -in_bb(settle_round(after_i_win).find((_, seat) => after_i_win[seat] === 0)),
        ante: engine.implicit_ante(counts, button, HERO),
      };
    });
    return {
      counts: LAST_SQUID, branches, table,
      swing: step.ante,
      penalty_avoided: -step.value_if_opponent_wins,
      collected: step.value_if_i_win,
    };
  }

  /** Hero on 4 (V(I win) is the jackpot itself), then a villain on 4 with hero on 0. */
  function jackpot(engine, button) {
    const hero_step = one_step(engine, HERO_ON_FOUR, button, HERO);
    const later = mean(opponents_of(HERO).map((seat) => engine.parts_after_hand(HERO_ON_FOUR, button, seat, HERO).p_my_jackpot));
    const villain = VILLAIN_ON_FOUR.findIndex((count) => count === 4);
    const villain_step = one_step(engine, VILLAIN_ON_FOUR, button, HERO);
    return {
      on_four: {
        value_if_i_win: hero_step.value_if_i_win,
        value_if_opponent_wins: hero_step.value_if_opponent_wins,
        ante: hero_step.ante,
        chance_of_jackpot_later: later,
        multiple: dead_money_multiple(hero_step.ante),
        stack: STACK_BB / dead_money_multiple(hero_step.ante),
      },
      villain_on_four: {
        value_if_i_win: villain_step.value_if_i_win,
        value_if_opponent_wins: villain_step.value_if_opponent_wins,
        value_if_villain_wins: villain_step.outcomes[villain].value,
        ante: villain_step.ante,
        denial: engine.denial_cost(VILLAIN_ON_FOUR, button, HERO, villain),
      },
    };
  }

  /** Pot odds with and without the squid: equity needed = call / (pot + call [+ swing]). */
  function pot_odds(pot, call, swing) {
    return { plain: call / (pot + call), with_squid: call / (pot + call + swing) };
  }

  /** Big-blind defence against an open, with a fresh squid as the swing. */
  function big_blind_defence(fresh_ante) {
    return { open: OPEN_BB, pot: BB_DEFENCE.pot, call: BB_DEFENCE.call, ...pot_odds(BB_DEFENCE.pot, BB_DEFENCE.call, fresh_ante) };
  }

  /** QuintAce Stand-up swing 6 * val / (N - 1), at the start (N = 6) and with two left (N = 2). */
  function standup_swing() {
    const swing = (players_without) => (6 * STANDUP_VAL_BB) / (players_without - 1);
    return { fresh: swing(6), late: swing(2) };
  }

  const api = { HERO, LAST_SQUID, one_step, fresh_round, last_squid, jackpot, pot_odds, big_blind_defence, standup_swing };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.SquidTutorial = api;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
