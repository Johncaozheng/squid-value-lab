/** The Bounty tab's subtitle and dead-money note, from the active data set's structure. */
function render_table_text() {
  const { posts_bb, stack_bb } = table_facts();
  $("subtitle").textContent = t("subtitle", { structure: t(`structure_${RANGES.id === "single_straddle" ? RANGES.id : "round1"}`) });
  $("method-4").textContent = t("method_4", { posts: amount(posts_bb, "bb"), deep: amount(stack_bb, "bb", 0) });
}

/** One plain-words line for the answer panel, chosen from the table's situation. */
function answer_takeaway(ante) {
  const mine = state.counts[state.me];
  const others = opponents_of(state.me).map((seat) => state.counts[seat]);
  const on_zero = state.counts.filter((count) => count === 0).length;
  const bounty = amount(ante);
  if (state.counts.every((count) => count === 0)) return t("take_fresh", { bounty });
  if (mine === 4) return t("take_me4", { bounty });
  if (mine === 3) return t("take_me3", { bounty });
  if (mine === 0 && on_zero === 2) return t("take_last_two");
  if (others.includes(4)) return t(mine === 0 ? "take_villain4_zero" : "take_villain4_holder");
  return t(mine === 0 ? "take_zero" : "take_holder", { bounty });
}

function render_answer(read, problem) {
  const me = state.me;
  $("who").textContent = `${position_of(me)} · ${seat_label(me)} · ${squids_text(state.counts[me])}`;
  $("flag").hidden = !problem;
  $("flag-reason").textContent = problem || "";
  $("hero-unit").textContent = unit_name();
  const dash = "–";
  if (!read) {
    for (const id of ["hero-ante", "stat-jackpot", "stat-hands", "stat-multiple", "stat-stack"]) $(id).textContent = dash;
    for (const id of ["hero-secondary", "stat-stack-secondary", "take-answer"]) $(id).textContent = "";
    $("swing-list").innerHTML = "";
    $("alert").hidden = true;
    return;
  }
  const { posts_bb, stack_bb: deep_bb } = table_facts();
  const multiple = (read.ante + posts_bb) / posts_bb;
  const stack_bb = deep_bb / multiple;
  $("hero-ante").textContent = number_in(read.ante, state.unit, 2);
  $("hero-secondary").textContent = also(read.ante, 2);
  $("stat-jackpot").textContent = percent(read.endings.jackpot);
  $("stat-hands").textContent = fixed(read.hands_left);
  $("take-answer").textContent = answer_takeaway(read.ante);
  $("stat-multiple").textContent = amount(read.ante + posts_bb);
  $("stat-stack").textContent = t("stat_stack_value", { value: amount(stack_bb, "bb", 0) });
  $("stat-stack-secondary").textContent = `≈ ${amount(stack_bb, "chips")}`;
  render_alert();
  render_swings(read);
}

function render_alert() {
  const near_jackpot = opponents_of(state.me).filter((seat) => state.counts[seat] === 4);
  const on_three = opponents_of(state.me).filter((seat) => state.counts[seat] === 3);
  const seats = near_jackpot.length ? near_jackpot : on_three;
  const alert = $("alert");
  alert.hidden = seats.length === 0;
  alert.className = near_jackpot.length ? "alert-pill" : "alert-pill caution";
  const key = `${near_jackpot.length ? "alert_four" : "alert_three"}_${seats.length > 1 ? "many" : "one"}`;
  alert.textContent = t(key, { names: seats.map(position_of).join(t("names_joiner")) });
}

function render_swings(read) {
  const sorted = [...read.swings].sort((a, b) => b.swing - a.swing);
  const scale = Math.max(...sorted.map((row) => row.swing), read.ante, 1e-9);
  const width = (bb) => `${Math.max(0, (100 * bb) / scale)}%`;
  $("swing-list").innerHTML = sorted.map(({ seat, swing, denial }) => {
    const base = Math.min(read.ante, Math.max(0, swing));
    const extra = Math.max(0, swing - read.ante);
    const count = state.counts[seat];
    const title = t("swing_row_title", { position: position_of(seat), swing: amount(swing, state.unit, 2), denial: amount(denial, state.unit, 2) });
    return `<li class="swing-row${count === 4 ? " at-four" : ""}" title="${title}">`
      + `<span class="swing-who"><b>${position_of(seat)}</b><span>${seat_label(seat)} · ${t("squids_short", { n: count })}</span></span>`
      + `<span class="swing-track"><span class="swing-base" style="width:${width(base)}"></span>`
      + `<span class="swing-extra" style="left:${width(read.ante)};width:${width(extra)}"></span>`
      + `<span class="swing-tick" style="left:${width(read.ante)}"></span></span>`
      + `<span class="cell-stack"><span class="swing-value">${number_in(swing)}</span><span class="secondary">${amount(swing, other_unit())}</span></span>`
      + `<span class="cell-stack swing-denial${denial > 0.05 ? " positive" : ""}"><span>${signed(denial)}</span><span class="secondary">${signed(denial, other_unit())} ${unit_name(other_unit())}</span></span></li>`;
  }).join("");
}

// Pot odds against one villain; the inputs take the unit currently shown.
function render_odds_inputs() {
  const shown = (bb) => (state.unit === "bb" ? String(Number(((bb * CHIPS_PER_BB) / table_facts().display_chips).toFixed(2))) : String(Math.round(bb * CHIPS_PER_BB)));
  const step = state.unit === "bb" ? "1" : "25";
  for (const [id, bb] of [["pot-size", state.pot], ["call-amount", state.call]]) {
    $(id).value = shown(bb);
    $(id).step = step;
  }
  $("pot-label").textContent = t("pot_label", { unit: unit_name() });
  $("call-label").textContent = t("call_label", { unit: unit_name() });
}

function read_odds_inputs() {
  const per_unit = state.unit === "bb" ? CHIPS_PER_BB / table_facts().display_chips : CHIPS_PER_BB;
  state.pot = Number($("pot-size").value) / per_unit;
  state.call = Number($("call-amount").value) / per_unit;
}

function render_villain_options(read) {
  const select = $("villain-seat");
  if (read && (state.villain === null || state.villain === state.me)) {
    state.villain = [...read.swings].sort((a, b) => b.swing - a.swing)[0].seat;
  }
  select.innerHTML = opponents_of(state.me).map((seat) => `<option value="${seat}">`
    + `${t("villain_option", { position: position_of(seat), seat: seat_label(seat), squids: squids_text(state.counts[seat]) })}</option>`).join("");
  if (state.villain !== null) select.value = String(state.villain);
}

function render_odds(read) {
  const { pot, call } = state;
  const valid = read && pot >= 0 && call > 0;
  const row = read && read.swings.find((entry) => entry.seat === state.villain);
  const plain = valid ? call / (pot + call) : null;
  const with_squid = valid && row ? Math.min(1, Math.max(0, call / (pot + call + row.swing))) : null;
  $("odds-note").textContent = t("odds_note", { unit: unit_name() });
  $("odds-plain").textContent = plain === null ? "–" : percent(plain);
  $("odds-squid").textContent = with_squid === null ? "–" : percent(with_squid);
  for (const [id, value] of [["odds-mark-plain", plain], ["odds-mark-squid", with_squid]]) {
    $(id).hidden = value === null;
    if (value !== null) $(id).style.left = `${100 * value}%`;
  }
  const span = $("odds-span");
  span.hidden = plain === null || with_squid === null;
  if (!span.hidden) {
    span.style.left = `${100 * Math.min(plain, with_squid)}%`;
    span.style.width = `${100 * Math.abs(plain - with_squid)}%`;
  }
  const helps = plain !== null && with_squid !== null && plain - with_squid > 0.05;
  $("take-odds").textContent = plain !== null && with_squid !== null
    ? t(helps ? "odds_take_wider" : "odds_take_same", { squid: percent(with_squid), plain: percent(plain) }) : "";
  $("odds-formula").textContent = row && valid
    ? t("odds_formula", { call: number_in(call), pot: number_in(pot), swing: number_in(row.swing), position: position_of(row.seat) })
    : t("odds_formula_blank");
}

// Every seat at once.
/** Background and ink for a value on the sequential blue ramp, share in [0, 1]. */
function ramp_style(share) {
  const strength = Math.round(8 + 92 * Math.min(1, Math.max(0, share)));
  const ink = strength > 55 ? "var(--on-accent)" : "var(--ink)";
  return `background:color-mix(in oklab, var(--seq-high) ${strength}%, var(--seq-low));color:${ink}`;
}

function render_strip(read) {
  const antes = read ? read.seat_antes : SEATS.map(() => null);
  const top = read ? Math.max(...antes) : 1;
  $("strip-note").textContent = t("strip_note", { unit: unit_name() });
  const leader = read ? SEATS.reduce((best, seat) => (antes[seat] > antes[best] ? seat : best), 0) : null;
  const all_equal = read && Math.max(...antes) - Math.min(...antes) < 0.05;
  $("take-strip").textContent = !read ? "" : all_equal
    ? t("strip_take_equal", { value: amount(antes[leader]) })
    : t("strip_take", { position: position_of(leader), value: amount(antes[leader]) });
  $("seat-strip").innerHTML = clockwise_from(0).map((seat) => {
    const ante = antes[seat];
    const style = ante === null ? "background:var(--surface-2)" : ramp_style(ante / top);
    const marks = `${seat === state.me ? `${t("strip_me")} · ` : ""}${seat === state.button ? "D · " : ""}${t("squids_short", { n: state.counts[seat] })}`;
    return `<div class="strip-cell${seat === state.me ? " is-me" : ""}" style="${style}" title="${position_of(seat)}, ${seat_label(seat)}">`
      + `<span class="strip-pos">${position_of(seat)}</span><span class="strip-value">${ante === null ? "–" : number_in(ante)}</span>`
      + `<span class="strip-meta">${ante === null ? "" : also(ante)}</span><span class="strip-meta">${marks}</span></div>`;
  }).join("");
}

// Context charts.
/** Button seat that puts hero seat 0 in my current position. */
function button_for_my_position() {
  return (NUM_PLAYERS - ((state.me - state.button + NUM_PLAYERS) % NUM_PLAYERS)) % NUM_PLAYERS;
}

function render_key_states(engine) {
  const button = button_for_my_position();
  const rows = PRESETS.map((preset) => ({ preset, ante: engine.implicit_ante(preset.counts, button, 0) }));
  const axis_max = nice_max(Math.max(...rows.map((row) => row.ante)), 20);
  const current = matching_preset();
  $("key-note").textContent = state.model === "uniform"
    ? t("key_note_any", { unit: unit_name() })
    : t("key_note_position", { unit: unit_name(), position: position_of(state.me) });
  const antes = rows.map((row) => row.ante);
  $("take-key").textContent = t("key_take", { min: amount(Math.min(...antes)), max: amount(Math.max(...antes)) });
  $("key-axis").innerHTML = [0, 0.5, 1].map((share) => `<span style="left:${100 * share}%">${number_in(axis_max * share, state.unit, 0)}</span>`).join("");
  $("key-bars").innerHTML = rows.map(({ preset, ante }) =>
    `<button type="button" class="hbar${current && current.id === preset.id ? " current" : ""}" id="key-${preset.id}" data-preset="${preset.id}" title="${preset_name(preset)}: ${amount(ante, state.unit, 2)} (${also(ante, 2)})">`
    + `<span class="hbar-label">${preset_name(preset)}</span><span class="hbar-track"><span class="hbar-fill" style="width:${(100 * ante) / axis_max}%"></span></span>`
    + `<span class="hbar-value">${number_in(ante)}</span></button>`).join("");
}

function render_heatmap(engine) {
  const me = state.me;
  const villain = (me + 1) % NUM_PLAYERS;
  const levels = [0, 1, 2, 3, 4];
  const ante_at = (mine, theirs) => {
    const counts = Array(NUM_PLAYERS).fill(0);
    counts[me] = mine;
    counts[villain] = theirs;
    return engine.implicit_ante(counts, state.button, me);
  };
  const grid = levels.map((mine) => levels.map((theirs) => ante_at(mine, theirs)));
  const low = Math.min(...grid.flat());
  const high = Math.max(...grid.flat());
  const their_max = Math.max(...opponents_of(me).map((seat) => state.counts[seat]));
  const is_now = (mine, theirs) => !state_problem(state.counts) && mine === state.counts[me] && theirs === their_max;
  const header = `<tr><th scope="col">${t("heat_corner")}</th>${levels.map((level) => `<th scope="col">${level}</th>`).join("")}</tr>`;
  const body = [...levels].reverse().map((mine) => `<tr><th scope="row">${mine}</th>${levels.map((theirs) => {
    const value = grid[mine][theirs];
    const title = t("heat_cell", { mine, theirs, value: `${amount(value, state.unit, 2)} (${also(value, 2)})` });
    return `<td class="${is_now(mine, theirs) ? "now" : ""}" style="${ramp_style((value - low) / (high - low))}" title="${title}">${number_in(value)}</td>`;
  }).join("")}</tr>`).join("");
  $("heat-note").textContent = unit_name();
  $("take-heat").textContent = t("heat_take", { low: amount(grid[0][0]), high: amount(grid[4][0]) });
  $("heat").innerHTML = `<caption>${t("heat_caption", { position: position_of(villain) })}</caption>${header}${body}`;
}

function ending_label(ending, short) {
  if (ending.losers === 0) return t(short ? "ending_short_jackpot" : "ending_name_jackpot");
  if (short) return t("ending_short_losers", { n: ending.losers });
  return ending.losers === 1 ? t("ending_name_loser") : t("ending_name_losers", { n: ending.losers });
}

function render_endings(engine, read) {
  const fresh = engine.ending_probabilities(Array(NUM_PLAYERS).fill(0), button_for_my_position());
  const here = read ? read.endings : null;
  const top = nice_max(100 * Math.max(...ENDINGS_SHOWN.map(({ name }) => Math.max(fresh[name], here ? here[name] : 0))), 10);
  const column = (p, series, label) => `<span class="column ${series}" style="height:${Math.max(0.5, (100 * 100 * p) / top)}%" title="${label}: ${percent(p)}">`
    + `<span class="column-value">${(100 * p).toFixed(p < 0.01 ? 2 : 1)}</span></span>`;
  $("ending-columns").innerHTML = ENDINGS_SHOWN.map((ending) => `<div class="column-group">`
    + column(fresh[ending.name], "s2", `${t("ending_fresh")}, ${ending_label(ending, false)}`)
    + (here ? column(here[ending.name], "s1", `${t("ending_here")}, ${ending_label(ending, false)}`) : "") + "</div>").join("");
  $("ending-labels").innerHTML = ENDINGS_SHOWN.map((ending) => `<span>${ending_label(ending, true)}</span>`).join("");
  const losers = ENDINGS_SHOWN.filter((ending) => ending.losers > 0);
  const typical = losers.reduce((best, ending) => (fresh[ending.name] > fresh[best.name] ? ending : best));
  $("take-ending").textContent = t("ending_take", { n: typical.losers, jackpot: percent(fresh.jackpot) });
  $("ending-note").textContent = t("ending_note", { hands: fixed(engine.expected_hands_remaining(Array(NUM_PLAYERS).fill(0), 0), 2), top });
}

function render_sensitivity() {
  const top = nice_max(Math.max(...SENSITIVITY.flatMap((row) => [row.position_only_bb, row.model_only_bb])), 2);
  const digits = 2;
  const line = (value, series) => `<span class="pair-line"><span class="pair-fill ${series}" style="width:${(100 * value) / top}%"></span><span class="pair-value">${number_in(value, state.unit, digits)}</span></span>`;
  $("sens-note").textContent = t("sens_unit", { unit: unit_name() });
  const most = (field) => Math.max(...SENSITIVITY.map((row) => row[field]));
  $("take-sens").textContent = t("sens_take", { position: amount(most("position_only_bb")), model: amount(most("model_only_bb")) });
  $("sensitivity-bars").innerHTML = SENSITIVITY.map((row) => {
    const name = t(`name_${row.preset}`);
    const title = t("sens_row_title", { state: name, position: amount(row.position_only_bb, state.unit, digits), model: amount(row.model_only_bb, state.unit, digits) });
    return `<div class="pair-row" title="${title}"><span>${name}</span><span class="pair-stack">${line(row.position_only_bb, "s1")}${line(row.model_only_bb, "s2")}</span></div>`;
  }).join("");
}

// Tabs: the main ranges screen (default), bounty maths and the tutorial, deep-linked by a bare hash (#bounty, #help).

const VIEW_OF_HASH = { ranges: "ranges", calc: "calc", bounty: "calc", how: "how", help: "how" };

// The "How it works" tab: every figure comes from SquidTutorial, which reads the solved engine.
const TUTORIAL_EXAMPLES = [
  { id: "fresh", counts: PRESETS[0].counts, label: () => t("preset_fresh") },
  { id: "last", counts: SquidTutorial.LAST_SQUID, label: () => t("tut_example_last") },
  { id: "me4", counts: PRESETS[4].counts, label: () => t("preset_me4") },
  { id: "villain4", counts: PRESETS[5].counts, label: () => t("preset_villain4") },
];

/** Signed amount with its unit, e.g. "+100 chips" or "−1,000 chips". */
const signed_amount = (bb, unit = state.unit, digits = 1) => `${signed(bb, unit, digits)} ${unit_name(unit)}`;

/** Rows of horizontal bars around zero, to one scale; each row is {label, value (BB), chance?, summary?, long? (label on its own line)}. */
function value_bars(rows) {
  const scale = Math.max(...rows.map((row) => Math.abs(row.value)), 1e-9);
  const has_negative = rows.some((row) => row.value < -1e-9);
  const zero = has_negative && rows.some((row) => row.value > 1e-9) ? 50 : has_negative ? 100 : 0;
  const room = zero === 50 ? 50 : 100;
  return `<div class="vbars">${rows.map((row) => {
    const width = (room * Math.abs(row.value)) / scale;
    const left = row.value >= 0 ? zero : zero - width;
    const chance = row.chance === undefined ? "" : `<span class="vbar-chance">${percent(row.chance)}</span>`;
    const layout = row.long ? " long" : row.chance === undefined ? " no-chance" : "";
    return `<div class="vbar-row${layout}${row.summary ? " summary" : ""}">`
      + `<span class="vbar-label">${row.label}</span>${chance}`
      + `<span class="vbar-track"><span class="vbar-zero" style="left:${zero}%"></span><span class="vbar-fill ${row.value >= 0 ? "positive" : "negative"}" style="left:${left}%;width:${width}%"></span></span>`
      + `<span class="cell-stack"><span class="vbar-value">${signed(row.value)}</span><span class="secondary">${signed_amount(row.value, other_unit())}</span></span></div>`;
  }).join("")}</div>`;
}

/** A small table: header cells, body rows of cells, and an optional class per row. */
function small_table(header, rows) {
  return `<table class="tut-table"><thead><tr>${header.map((cell) => `<th scope="col">${cell}</th>`).join("")}</tr></thead>`
    + `<tbody>${rows.map((row) => `<tr class="${row.class || ""}">${row.cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

const step_heading = (step, text) => `<span class="tut-step">${step}</span><span>${text}</span>`;

function render_tutorial(engine) {
  const button = button_for_my_position();
  const fresh = SquidTutorial.fresh_round(engine, button, table_facts());
  const last = SquidTutorial.last_squid(engine, button, SquidEngine.settle_round);
  const jackpot = SquidTutorial.jackpot(engine, button, table_facts());
  const problem = state_problem(state.counts);
  const current = problem ? null : SquidTutorial.one_step(engine, state.counts, state.button, state.me);
  render_tutorial_examples();
  render_one_step(current, problem);
  render_fresh_section(fresh);
  render_last_squid_section(last);
  render_jackpot_section(jackpot, fresh);
  render_formula_sheet(engine, current, fresh, last);
  render_table_rules(fresh, last, jackpot);
}

function render_tutorial_examples() {
  const pressed = TUTORIAL_EXAMPLES.find((example) => counts_from_me(example.counts, state.me).every((count, seat) => count === state.counts[seat]));
  $("tut-examples").innerHTML = TUTORIAL_EXAMPLES.map((example) => `<button type="button" class="preset" id="tut-example-${example.id}" data-example="${example.id}" aria-pressed="${pressed === example}">${example.label()}</button>`).join("");
}

function render_one_step(step, problem) {
  $("tut1-state").textContent = problem ? t("tut_invalid") : t("tut1_state", { position: position_of(state.me), squids: squids_text(state.counts[state.me]) });
  if (!step) {
    $("tut1-body").innerHTML = "";
    return;
  }
  const rows = clockwise_from(state.me).map((seat) => ({
    label: seat === state.me ? `<b>${t("tut1_me_wins")}</b>` : position_of(seat),
    chance: step.outcomes[seat].chance,
    value: step.outcomes[seat].value,
  }));
  if (step.chop.chance > 0) rows.push({ label: t("tut1_chop"), chance: step.chop.chance, value: step.chop.value });
  const header = `<div class="vbar-row tut-head muted"><span>${t("tut1_col_outcome")}</span><span class="vbar-chance">${t("tut1_col_chance")}</span><span></span><span>${t("tut1_col_value")}</span></div>`;
  const summary = value_bars([
    { label: t("tut1_v_win"), value: step.value_if_i_win, summary: true },
    { label: t("tut1_v_opponents"), value: step.value_if_opponent_wins },
    { label: t("tut1_ante"), value: step.ante, summary: true },
  ]);
  $("tut1-body").innerHTML = `${header}${value_bars(rows)}<p class="tut-check">${t("tut1_check", { value: amount(step.weighted_sum, state.unit, 2) })}</p>${summary}`;
}

function render_fresh_section(fresh) {
  $("tut2-title").innerHTML = step_heading(2, t("tut2_title", { ante: amount(fresh.ante) }));
  const symmetric = state.model === "uniform";
  $("tut2-check").textContent = t(symmetric ? "tut2_check" : "tut2_check_position", {

  render_table();

  render_table_text();
  render_answer(read, problem);
  render_villain_options(read);
  render_odds(read);
  render_strip(read);
  render_key_states(engine);

/** Redraw only the pot-odds panel after its inputs change. */

let chop_timer;
function wire_controls() {
  for (const input of document.querySelectorAll('input[name="tap-mode"]')) {
    input.addEventListener("change", () => set_mode(input.value));
  }
  for (const input of document.querySelectorAll('input[name="win-model"]')) {
    input.addEventListener("change", () => { state.model = input.value; update(); });
  }
  for (const input of document.querySelectorAll('input[name="unit"]')) {
    input.addEventListener("change", () => { state.unit = input.value; render_odds_inputs(); update(); });
  }
  for (const input of document.querySelectorAll('input[name="language"]')) {
    input.addEventListener("change", () => { state.language = input.value; apply_language(); render_odds_inputs(); update(); });
  }
  $("chop-rate").addEventListener("input", (event) => {
    state.chop = Number(event.target.value);
    $("chop-value").textContent = `${state.chop}%`;
    clearTimeout(chop_timer);
    chop_timer = setTimeout(update, 150);
  });
  for (const id of ["pot-size", "call-amount"]) {
    $(id).addEventListener("input", () => { read_odds_inputs(); update_odds(); });
  }
  $("villain-seat").addEventListener("change", (event) => { state.villain = Number(event.target.value); update_odds(); });
  $("odds-form").addEventListener("submit", (event) => event.preventDefault());
  for (const view of VIEWS) $(`tab-${view}`).addEventListener("click", () => { location.hash = view; });
  for (const [index, view] of VIEWS.entries()) {
    $(`tab-${view}`).addEventListener("keydown", (event) => {
      const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
      if (!step) return;
      const next = VIEWS[(index + step + VIEWS.length) % VIEWS.length];
      location.hash = next;
      $(`tab-${next}`).focus();
    });
  }
  window.addEventListener("hashchange", () => show_view(view_from_hash()));
  $("tut-examples").addEventListener("click", (event) => {
    const chip = event.target.closest("[data-example]");
    if (!chip) return;
    state.counts = counts_from_me(TUTORIAL_EXAMPLES.find((example) => example.id === chip.dataset.example).counts, state.me);
    state.villain = null;
    update();
  });
  $("key-bars").addEventListener("click", (event) => {
    const bar = event.target.closest("[data-preset]");
    if (bar) load_preset(PRESETS.find((preset) => preset.id === bar.dataset.preset));
  });
}

// Main screen: the squid monitor (table), the hand's action bar, one big range grid with a compact legend, and a "More" drawer.
"use strict";

const MAIN_KEY = "squid-value-lab-main";
// action shorthand by ranges_logic label key; open small and open big both read "Open <size>"
const SHORTHAND = {
  act_fold: "sh_fold", act_check: "sh_check", act_call: "sh_call", act_limp: "sh_limp", act_jam: "sh_jam",
  act_open_small: "sh_open", act_open_big: "sh_open", act_iso: "sh_iso", act_3bet: "sh_3bet", act_4bet: "sh_4bet", act_5bet: "sh_5bet",
};
const main_ui = { mode: "squids", path: null, situation: null, realisation: null, filter: null, popover: null, blend_open: false, dataset: DATASETS[0].id };
const NEAR_TIE_CHIPS = 15;
const main_cells = [];
const main_seats = [];
let main_dealer;

const main_state = (id) => RANGES.states.find((entry) => entry.id === id);
const main_realisations = (id) => (RANGES.round3 ? ["calibrated"] : main_state(id).realisations || RANGES.realisations.filter((r) => RangesLogic.find_solve(RANGES, id, r)));
const main_loaded = (id) => !RANGES.files || RANGES.solves.some((solve) => solve.state === id);
/** Short name from who holds what: "Fresh round", "SB on 4, 7 on 0", "BTN on 4, two left: SB, STR". */
function short_state(squids) {
  if (!squids.some(Boolean)) return t("m_name_fresh");
  const parts = RANGES.positions.flatMap((position, index) => (squids[index] >= 3 ? [t("m_name_on", { position, n: squids[index] })] : []));
  const zeros = RANGES.positions.filter((_, index) => squids[index] === 0);
  const last = zeros.length === 2 ? t("m_name_two_left", { a: zeros[0], b: zeros[1] }) : t("m_name_zeros", { n: zeros.length });
  parts.push(parts.length && state.language === "en" ? last[0].toLowerCase() + last.slice(1) : last);
  return parts.join(t("m_name_joiner"));
}
const main_fetching = new Set();
const main_failed = new Set();

/** Fetch one file once and hand the response to keep, then redraw. */
async function main_fetch(url, keep) {
  if (main_fetching.has(url) || main_failed.has(url)) return;
  main_fetching.add(url);
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await keep(response);
  } catch (error) {
    main_failed.add(url);
  } finally {
    main_fetching.delete(url);
    if (current_view === "ranges") render_main();
  }
}

// Round 3 data: a manifest, then each anchor's core (and deep) file on demand; the tapped state's solve is the weighted blend of what is loaded.
const anchor_parts = new Map();  // "<anchor>.<part>" -> decoded nodes, oldest first
const MAX_CACHED_PARTS = 24;  // 12 anchors, core and deep
let round3_engine;

/** Decoded nodes of one anchor part, or undefined while it is being fetched. */
function anchor_part(id, part) {
  const key = `${id}.${part}`;
  if (!anchor_parts.has(key)) {
    main_fetch(`${RANGES.files}${key}.bin`, async (response) => {
      anchor_parts.set(key, RangesLogic.decode_part(await RangesLogic.gunzip(response), RANGES.nodes.filter((node) => node.part === part), RANGES.chips_per_bb));
      while (anchor_parts.size > MAX_CACHED_PARTS) anchor_parts.delete(anchor_parts.keys().next().value);
    });
  }
  return anchor_parts.get(key);
}

/** True once the tapped state's solve holds these parts (blended from its anchors and stored in RANGES.solves); starts any missing fetch. */
function round3_ready(situation, parts) {
  const have = RangesLogic.find_solve(RANGES, situation.id, "calibrated");
  if (have && parts.every((part) => have.parts.includes(part))) return true;
  const lists = parts.map((part) => situation.anchors.map(({ id }) => anchor_part(id, part)));
  if (lists.flat().includes(undefined)) return false;
  const weights = situation.anchors.map(({ weight }) => weight);
  const gains = situation.anchors.map(({ id }) => RANGES.anchors.find((anchor) => anchor.id === id).gain_bb);
  const solve = { state: situation.id, realisation: "calibrated", parts, exploitability_bb: Math.max(...gains), nodes: lists.flatMap((list) => RangesLogic.blend_nodes(list, weights)) };
  RANGES.solves = [...RANGES.solves.filter((other) => other.state !== situation.id), solve].slice(-8);
  return true;
}

/** True once a situation's solve holds these parts; otherwise starts the fetches it needs. */
function main_ready(situation, parts) {
  if (RANGES.round3) return round3_ready(situation, parts);
  if (!main_loaded(situation.id)) main_fetch(`${RANGES.files}${situation.id}.json`, async (response) => RANGES.solves.push(...(await response.json()).solves));
  return main_loaded(situation.id);
}

// The table's situation in the data's terms: posts sit just before the first actor, as in payoffs.seat_of_position.
const num_posts = () => Object.keys(RANGES.blinds || { SB: 0.5, BB: 1 }).length;
const seat_of = (position_index) => (state.button + 1 + num_posts() + position_index) % NUM_PLAYERS;
const position_at_seat = (seat) => RANGES.positions[(seat - state.button - 1 - num_posts() + 2 * NUM_PLAYERS) % NUM_PLAYERS];
const counts_by_position = () => RANGES.positions.map((_, index) => state.counts[seat_of(index)]);
const my_position = () => position_at_seat(state.me);

/** The situation to draw: round 3, the tapped squids with how they are solved ({mode, anchors, gap}); older data, the solved state equal to them or the nearest one. */
function solved_situation(problem) {
  const squids = counts_by_position();
  if (!RANGES.round3) {
    const { state: nearest, exact } = RangesLogic.nearest_state(RANGES, squids);
    return { id: nearest.id, squids: nearest.squids, exact };
  }
  round3_engine = round3_engine || SquidEngine.create_engine("uniform", 0);
  const solved = RANGES.anchors && !problem ? RangesLogic.pick_blend(RANGES.anchors, RangesLogic.squid_offsets(round3_engine, squids, num_posts()), squids) : {};
  return { id: squids.join("-"), squids, ...solved };
}

// The hand so far, using the betting rules in ranges_logic.js with this dataset's positions, blinds and stack.
const main_rules = () => RangesLogic.hand_rules(RANGES);
const replay = (path) => RangesLogic.replay(main_rules(), path);
const next_to_act = RangesLogic.next_to_act;
const spot_of = RangesLogic.spot_of;
const path_to = (spot) => RangesLogic.path_to(main_rules(), spot);

// Sizes are in the data set's big blinds (25 chips in the real game, 50 in round 1); the bounty engine works in 50-chip BB.
const data_chips_per_bb = () => RANGES.chips_per_bb || CHIPS_PER_BB;
/** A bet size in the current unit, compact: "600" chips or "24bb". */
const short_size = (bb) => (state.unit === "chips" ? Math.round(bb * data_chips_per_bb()).toLocaleString("en-US") : `${Number(bb.toFixed(2))}bb`);
/** A seat's bounty (engine BB) on the same scale as the sizes. */
const bounty_text = (engine_bb) => short_size((engine_bb * CHIPS_PER_BB) / data_chips_per_bb());

/** A signed EV in the current unit, from data big blinds: "+120", "−25", "0". */
const ev_text = (bb) => `${bb > 0.0001 ? "+" : bb < -0.0001 ? "−" : ""}${short_size(Math.abs(bb))}`;

/** Shorthand for a step already taken ("Open 125", "3-bet", "Limp"), from the steps before it. */
function step_label(step, before) {
  const raises = before.filter((other) => other.kind === "raise").length;
  const limped = before.some((other) => other.kind === "call");
  if (step.kind === "raise") {
    const key = raises === 0 ? (limped ? "sh_iso" : "sh_open") : ["", "sh_3bet", "sh_4bet"][raises] || "sh_5bet";
    return t(key, { size: step.to_bb === null || step.to_bb === undefined ? "" : short_size(step.to_bb) }).trim();
  }
  if (step.kind === "call") return t(raises === 0 ? "sh_limp" : "sh_call");
  return t(`sh_${step.kind === "jam" ? "jam" : step.kind}`);
}

/** Shorthand labels for a node's actions. */
const node_labels = (node) => RangesLogic.action_labels(node).map((label) => t(SHORTHAND[label.key], { size: label.to_bb === undefined ? "" : short_size(label.to_bb) }).trim());

// The squid monitor: the shared 8-seat table, each seat with its position, squids and bounty.
function build_monitor() {
  const wrap = $("m-table-wrap");
  for (const seat of SEATS) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "seat";
    button.id = `m-seat-${seat}`;
    const point = table_point(seat, 39, 37);
    button.style.left = `${point.left}%`;
    button.style.top = `${point.top}%`;
    button.addEventListener("click", () => tap_monitor(seat));
    wrap.appendChild(button);
    main_seats.push(button);
  }
  main_dealer = document.createElement("div");
  main_dealer.className = "dealer";
  main_dealer.textContent = "D";
  main_dealer.setAttribute("aria-hidden", "true");
  wrap.appendChild(main_dealer);
}

function tap_monitor(seat) {
  if (main_ui.mode === "squids") state.counts[seat] = (state.counts[seat] + 1) % 5;
  if (main_ui.mode === "button") state.button = seat;
  if (main_ui.mode === "me") state.me = seat;
  main_ui.mode = "squids";
  main_ui.path = null;
  update();
}

/** The felt's text: the state's name, and in round 3 the badge (Solved, Blended from N nearby solves, Rough) that opens the list of anchors behind it. */
function felt_html(situation) {
  const name = `<span class="felt-line">${RANGES.round3 || situation.exact ? short_state(situation.squids) : t("m_nearest", { name: short_state(situation.squids) })}</span>`;
  if (!situation.mode) return name;
  const away = (gap) => `${short_size(gap / data_chips_per_bb())}${state.unit === "chips" ? ` ${t("unit_chips")}` : ""}`;
  const label = { solved: t("m_solved"), blend: situation.anchors.length === 1 ? t("m_blended_one") : t("m_blended", { n: situation.anchors.length }), rough: t("m_rough", { gap: away(situation.gap) }) }[situation.mode];
  const holders = (squids) => (squids.some(Boolean) ? RANGES.positions.flatMap((position, seat) => (squids[seat] ? [`${position} ${squids[seat]}`] : [])).join(" ") : t("m_name_fresh"));
  const rows = situation.anchors.map(({ id, weight }) => `${holders(RANGES.anchors.find((anchor) => anchor.id === id).squids)} ${percent(weight)}`);
  if (situation.mode === "blend") rows.push(away(situation.gap));
  return `${name}<button type="button" class="felt-pill" id="m-pill" aria-expanded="${main_ui.blend_open}"><i class="tier-dot mode-${situation.mode}"></i>${label}</button>`
    + (main_ui.blend_open && situation.mode !== "solved" ? `<span class="felt-sub">${rows.join(" · ")}</span>` : "");
}

function render_monitor(situation, problem) {
  const antes = problem ? null : SEATS.map((seat) => current_engine().implicit_ante(state.counts, state.button, seat));
  for (const seat of SEATS) {
    const count = state.counts[seat];
    const button = main_seats[seat];
    button.className = `seat${seat === state.me ? " is-me" : ""}${count === 3 ? " at-three" : ""}${count >= 4 ? " at-four" : ""}`;
    button.innerHTML = `${seat === state.me ? `<span class="seat-tag">${t("me_tag")}</span>` : ""}<span class="seat-pos">${position_at_seat(seat)}</span>`
      + `<span class="seat-count">${count}</span><span class="seat-bounty">${antes ? bounty_text(antes[seat]) : "–"}</span>`;
    button.setAttribute("aria-label", t("seat_aria", { seat: seat_label(seat), position: position_at_seat(seat), squids: squids_text(count) }));
  }
  const chip = table_point(state.button, 23, 18);
  main_dealer.style.left = `${chip.left}%`;
  main_dealer.style.top = `${chip.top}%`;
  $("m-felt").innerHTML = problem ? `<span class="felt-line">${t("m_impossible")}</span>` : felt_html(situation);
  for (const mode of ["squids", "button", "me"]) $(`m-mode-${mode}`).checked = main_ui.mode === mode;
}

// The action bar: one chip per step taken (tap to go back), then the current decision as big buttons.
function render_bar(path, actor, node, over) {
  const chips = path.map((step, index) => `<li><button type="button" class="m-step${step.kind === "fold" ? " is-fold" : ""}" id="m-step-${index}" data-step="${index}">`
    + `<b>${step.seat}</b> ${step_label(step, path.slice(0, index))}</button></li>`);
  const current = actor === null ? `<li class="m-step is-end">${t("m_flop")}</li>` : `<li class="m-step is-current"><b>${actor}</b> ?</li>`;
  $("m-bar").innerHTML = [...chips, current].join('<li class="m-sep" aria-hidden="true">›</li>');
  const groups = node ? RangesLogic.action_groups(node) : [];
  const labels = node ? node_labels(node) : [];
  $("m-actions").innerHTML = actor === null ? "" : node
    ? node.actions.map((action, index) => `<button type="button" class="m-act grp-edge-${groups[index]}" id="m-act-${index}" data-act="${index}">${labels[index]}</button>`).join("")
    : `<button type="button" class="m-act grp-edge-fold" id="m-act-fold" data-fold="1">${t("sh_fold")}</button>`;
  $("m-missing").hidden = !(over || (actor !== null && !node));
  $("m-missing").textContent = over ? t("m_over") : t("m_rare");
  $("m-locked").hidden = !(node && node.locked);
  $("m-locked").textContent = t("m_locked", { cap: RANGES.entrant_cap || 4 });
}

// The grid: one button per class, its background a stack of action bands scaled by range weight.
function build_main_grid() {
  const grid = $("m-grid");
  RANGES.classes.forEach((name, index) => {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "rg-cell";
    cell.id = `m-cell-${index}`;
    cell.dataset.index = String(index);
    cell.innerHTML = `<span>${name}</span>`;
    grid.appendChild(cell);
    main_cells.push(cell);
  });
}

function cell_background(node, index, groups) {
  const weight = RangesLogic.range_weight(node, index);
  const by_group = Object.fromEntries(RangesLogic.GROUPS.map((group) => [group, 0]));
  node.strategy[index].forEach((permille, action) => { by_group[groups[action]] += permille / 10; });
  let top = 0;
  const stops = [];
  for (const group of RangesLogic.GROUPS) {
    const height = by_group[group] * weight;
    if (height <= 0) continue;
    const colour = main_ui.filter && main_ui.filter !== group ? "var(--rg-muted)" : `var(--act-${group.replace("_", "-")})`;
    stops.push(`${colour} ${top}% ${top + height}%`);
    top += height;
  }
  if (top < 100) stops.push(`transparent ${top}% 100%`);
  return `linear-gradient(to bottom, ${stops.join(", ")}), var(--rg-empty)`;
}

/** "Mostly Open 125 (70%)": the simple decision for one class. */
function main_decision(node, index) {
  const labels = node_labels(node);
  const { kind, top, second } = RangesLogic.decision(node, index);
  if (kind === "mixed") return t("rg_mixed", { a: labels[top.action], pa: percent(top.share), b: labels[second.action], pb: percent(second.share) });
  return t(kind === "always" ? "rg_always" : "rg_mostly", { action: labels[top.action], share: percent(top.share) });
}

/** The legend's EV note: "—" (with the reason on hover) for an action taken under 1% of the time, since its average is mostly premiums mixing in. */
const legend_ev = (frequency, ev) => (ev === null ? "" : frequency < 0.01 ? `<small title="${t("m_ev_rare")}">${t("m_ev")} —</small>` : `<small>${t("m_ev")} ${ev_text(ev)}</small>`);

function render_grid(node, flags, situation) {
  $("m-range").hidden = !node;
  if (!node) return;
  const groups = RangesLogic.action_groups(node);
  main_cells.forEach((cell, index) => {
    cell.style.background = cell_background(node, index, groups);
    cell.classList.toggle("flag", Boolean(flags[index]));
    cell.classList.toggle("selected", main_ui.popover === index);
    cell.setAttribute("aria-label", `${RANGES.classes[index]}: ${main_decision(node, index)}`);
  });
  const tier = node.reliability ? node.reliability.tier : null;
  $("m-grid").classList.toggle("is-sample", RANGES.sample);
  const solve = RangesLogic.find_solve(RANGES, main_ui.situation, main_ui.realisation);
  const accuracy = `${short_size(100 * solve.exploitability_bb)}${state.unit === "chips" ? ` ${t("unit_chips")}` : ""}`;
  const details = node.reliability ? t("m_badge_title", { reach: percent(node.reliability.reach), accuracy }) : "";
  $("m-badge").innerHTML = tier ? `<i class="tier-dot tier-${tier}"></i>${t(`m_tier_${tier}`)}` : "";
  $("m-badge").title = details;
  $("m-legend").innerHTML = RangesLogic.summary(node).map(({ frequency, ev }, action) => `<li><button type="button" class="m-key" id="m-key-${action}" data-group="${groups[action]}" aria-pressed="${main_ui.filter === groups[action]}">`
    + `<i class="swatch grp-${groups[action]}"></i>${node_labels(node)[action]}<b>${percent(frequency)}</b>${legend_ev(frequency, ev)}</button></li>`).join("");
  render_popover(node);
}

/** True when the hand's two best actions are within 15 chips of EV. */
function is_near_tie(node, index) {
  if (!node.ev_bb) return false;
  const [best, second] = [...node.ev_bb[index]].sort((a, b) => b - a);
  return second !== undefined && best - second < NEAR_TIE_CHIPS / data_chips_per_bb();
}

function render_popover(node) {
  const index = main_ui.popover;
  $("m-pop").hidden = index === null || !node;
  if (index === null || !node) return;
  const groups = RangesLogic.action_groups(node);
  const labels = node_labels(node);
  const rows = node.actions.map((_, action) => `<div class="m-pop-row"><i class="swatch grp-${groups[action]}"></i><span>${labels[action]}</span><b>${percent(node.strategy[index][action] / 1000)}</b>${node.ev_bb ? `<small>${t("m_ev")} ${ev_text(node.ev_bb[index][action])}</small>` : ""}</div>`).join("");
  $("m-pop").innerHTML = `<button type="button" class="m-pop-close" id="m-pop-close" aria-label="${t("m_close")}">×</button>`
    + `<p class="m-pop-head"><b>${RANGES.classes[index]}</b> ${main_decision(node, index)}</p>${rows}${is_near_tie(node, index) ? `<p class="m-pop-tie">≈ ${t("m_tie")}</p>` : ""}`;
}

// The "More" drawer: postflop assumption and one line per table note.
function render_more(situation) {
  for (const realisation of RANGES.realisations) {
    $(`m-real-${realisation}`).checked = realisation === main_ui.realisation;
    $(`m-real-${realisation}`).disabled = !main_realisations(situation.id).includes(realisation);
  }
  const { edge, player_on_four: four, last_two: last, walk_denial: walk } = RANGES.panels;
  const sample = (panel) => (panel.sample ? ` <span class="rg-sample-tag">${t("rg_sample_tag")}</span>` : "");
  const mean = (field) => {
    const value = Math.round(four.rows.reduce((total, row) => total + row[field], 0) / four.rows.length);
    return `${value > 0 ? "+" : value < 0 ? "−" : ""}${Math.abs(value)}`;
  };
  const zero = last.rows.find((row) => row.squids === 0) || last.rows[0];
  const closer = RANGES.panels.closer || "BB";
  const notes = [
    [four, t("m_note_four", { closer, three_bet: mean("three_bet_extra_pp"), call: mean("bb_call_extra_pp") })],
    [last, t("m_note_last", { closer, position: zero.position, plays: zero.plays_pct, defend: last.bb_defend_pct })],
    [walk, t("m_note_walk", { closer, opens: walk.rows.map((row) => `${row.position} ${row.open_pct}%`).join(" · ") })],
    [edge, t("m_note_edge", { edge: amount(edge.bb_per_100) })],
  ];
  $("m-notes").innerHTML = notes.map(([panel, text]) => `<li>${text}${sample(panel)}</li>`).join("");
}

// Data sets: the real game (single straddle, default) and round 1, switched from More.
const has_dataset = (id) => DATASETS.some((entry) => entry.id === id);

function use_dataset(id) {
  RANGES = DATASETS.find((entry) => entry.id === id) || DATASETS[0];
  Object.assign(main_ui, { dataset: RANGES.id, path: null, situation: null, popover: null, filter: null });
  render_odds_inputs();
  update();
}

function render_dataset_controls() {
  $("m-model-row").hidden = !(has_dataset("single_straddle") && has_dataset("round1"));
  $("m-model-real").checked = RANGES.id === "single_straddle";
  $("m-model-round1").checked = RANGES.id === "round1";
}

/** Replace the bar and grid with one line (loading, failed or impossible). */
function show_message(text) {
  $("m-bar").innerHTML = `<li class="m-step is-end">${text}</li>`;
  $("m-actions").innerHTML = "";
  $("m-range").hidden = true;
}

function render_main() {
  const problem = state_problem(state.counts);
  render_dataset_controls();
  if (RANGES.round3 && !RANGES.anchors) {
    main_fetch(`${RANGES.files}manifest.json`, async (response) => {
      const manifest = await response.json();
      Object.assign(RANGES, manifest, { part_of: Object.fromEntries(manifest.nodes.map((node) => [node.spot, node.part])) });
    });
  }
  const situation = solved_situation(problem);
  $("m-model").hidden = !RANGES.model;
  if (RANGES.model) $("m-model").textContent = RANGES.model[state.language] || RANGES.model.en;
  $("m-sample").hidden = !RANGES.sample;
  render_monitor(situation, problem);
  const waiting = () => show_message(main_failed.size ? t("rg_load_failed") : t("rg_loading"));
  if (RANGES.round3 && (problem || !RANGES.anchors)) return problem ? show_message(t("m_impossible")) : waiting();
  if (!main_ready(situation, ["core"])) return waiting();
  const realisations = main_realisations(situation.id);
  if (!realisations.includes(main_ui.realisation)) main_ui.realisation = realisations[0];
  const solve = RangesLogic.find_solve(RANGES, situation.id, main_ui.realisation);
  if (main_ui.situation !== situation.id || main_ui.path === null) main_ui.path = [];  // every squid setup starts with UTG+1 to act
  main_ui.situation = situation.id;
  const hand = replay(main_ui.path);
  const actor_index = next_to_act(hand);
  const actor = actor_index === null ? null : RANGES.positions[actor_index];
  const spot_here = actor === null ? null : spot_of(main_ui.path, actor);
  if (RANGES.round3 && RANGES.part_of[spot_here] === "deep" && !main_ready(situation, ["core", "deep"])) return waiting();
  const node = actor === null ? null : RangesLogic.find_node(solve, spot_here);
  render_bar(main_ui.path, actor, node, actor === null);
  const spot = node ? node.spot : null;
  const bracket = (realisation) => spot && RangesLogic.find_node(RangesLogic.find_solve(RANGES, situation.id, realisation), spot);
  render_grid(node, RangesLogic.bracket_flags(bracket("low"), bracket("high")), situation);
  render_more(situation);
  try {
    localStorage.setItem(MAIN_KEY, JSON.stringify({ realisation: main_ui.realisation, dataset: main_ui.dataset }));
  } catch (error) { /* storage blocked: nothing to remember */ }
}

function wire_main() {
  const on_click = (id, selector, handler) => $(id).addEventListener("click", (event) => {
    const target = event.target.closest(selector);
    if (target) handler(target);
  });
  on_click("m-bar", "[data-step]", (target) => { main_ui.path = main_ui.path.slice(0, Number(target.dataset.step)); main_ui.popover = null; render_main(); });
  on_click("m-actions", "[data-act]", (target) => {
    const node = RangesLogic.find_node(RangesLogic.find_solve(RANGES, main_ui.situation, main_ui.realisation),
      spot_of(main_ui.path, RANGES.positions[next_to_act(replay(main_ui.path))]));
    const action = node.actions[Number(target.dataset.act)];
    main_ui.path = [...main_ui.path, { seat: RangesLogic.spot_steps(node.spot).actor, kind: action.kind, to_bb: action.to_bb ?? null }];
    main_ui.popover = null;
    main_ui.filter = null;
    render_main();
  });
  on_click("m-actions", "[data-fold]", () => {
    main_ui.path = [...main_ui.path, { seat: RANGES.positions[next_to_act(replay(main_ui.path))], kind: "fold" }];
    render_main();
  });
  on_click("m-felt", "#m-pill", () => { main_ui.blend_open = !main_ui.blend_open; render_main(); });
  on_click("m-legend", "[data-group]", (target) => { main_ui.filter = main_ui.filter === target.dataset.group ? null : target.dataset.group; render_main(); });
  on_click("m-grid", ".rg-cell", (target) => { main_ui.popover = main_ui.popover === Number(target.dataset.index) ? null : Number(target.dataset.index); render_main(); });
  on_click("m-pop", "#m-pop-close", () => { main_ui.popover = null; render_main(); });
  $("m-reset").addEventListener("click", () => {
    state.counts = Array(NUM_PLAYERS).fill(0);
    main_ui.path = null;
    update();
  });
  for (const mode of ["squids", "button", "me"]) $(`m-mode-${mode}`).addEventListener("change", () => { main_ui.mode = mode; });
  for (const realisation of RANGES.realisations) $(`m-real-${realisation}`).addEventListener("change", () => { main_ui.realisation = realisation; render_main(); });
  $("m-model-real").addEventListener("change", () => use_dataset("single_straddle"));
  $("m-model-round1").addEventListener("change", () => use_dataset("round1"));
}

function start_main() {
  try {
    const saved = JSON.parse(localStorage.getItem(MAIN_KEY) || "null");
    if (saved && RANGES.realisations.includes(saved.realisation)) main_ui.realisation = saved.realisation;
    if (saved && has_dataset(saved.dataset)) RANGES = DATASETS.find((entry) => entry.id === saved.dataset);
    main_ui.dataset = RANGES.id;
  } catch (error) { /* storage blocked or corrupt: keep the defaults */ }
  build_monitor();
  build_main_grid();
  wire_main();
}

start();
</script>
